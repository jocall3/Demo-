# .github/workflows/deploy.yml - RE-ARCHITECTED
# This GitHub Actions workflow orchestrates the build and deployment of the entire microservices architecture.
# It aligns with a secure, multi-service, cloud-native deployment strategy.
#
# Architectural Changes Reflected:
# 1. Monorepo Support: Builds and deploys multiple backend services from the monorepo.
# 2. Micro-Frontend Deployment: Builds multiple Micro-Frontends (MFE-Shell, Dashboard, etc.) and deploys them to Google Cloud Storage for static hosting.
# 3. Zero-Trust Secret Management: Services are configured to fetch secrets from HashiCorp Vault at startup. This pipeline provides the necessary Vault authentication details (Role ID, Secret ID).
# 4. CQRS & Event Sourcing: Services are configured with Kafka broker details (via Vault) to support the event-driven architecture.
# 5. Durable Sagas: Services are configured with Temporal connection details (via Vault) to orchestrate long-running, stateful business processes.
# 6. Service Mesh Principles: Backend services are deployed to Cloud Run with internal-only ingress, with the API Gateway as the single public entry point.

name: Deploy Microservices and Micro-Frontends

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write' # Required for Workload Identity Federation to GCP

concurrency:
  group: "production-deploy"
  cancel-in-progress: true

jobs:
  # =================================================================================
  # JOB 1: Build and Push Backend Docker Images
  # =================================================================================
  build-backend-images:
    name: Build & Push Backend Images
    runs-on: ubuntu-latest
    outputs:
      api_gateway_image_uri: ${{ steps.build-api-gateway.outputs.image_uri }}
      user_service_image_uri: ${{ steps.build-user-service.outputs.image_uri }}
      accounts_service_image_uri: ${{ steps.build-accounts-service.outputs.image_uri }}
      transactions_service_image_uri: ${{ steps.build-transactions-service.outputs.image_uri }}
      ai_agent_service_image_uri: ${{ steps.build-ai-agent-service.outputs.image_uri }}
      plaid_integration_service_image_uri: ${{ steps.build-plaid-integration-service.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Google Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker for Google Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push API Gateway Image
        id: build-api-gateway
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/api-gateway:${{ github.sha }}"
          docker build -t $IMAGE_URI ./api-gateway
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build and Push User Service Image
        id: build-user-service
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/user-service:${{ github.sha }}"
          docker build -t $IMAGE_URI ./services/user-service
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build and Push Accounts Service Image
        id: build-accounts-service
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/accounts-service:${{ github.sha }}"
          docker build -t $IMAGE_URI ./services/accounts-service
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build and Push Transactions Service Image
        id: build-transactions-service
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/transactions-service:${{ github.sha }}"
          docker build -t $IMAGE_URI ./services/transactions-service
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build and Push AI Agent Service Image
        id: build-ai-agent-service
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/ai-agent-service:${{ github.sha }}"
          docker build -t $IMAGE_URI ./services/ai-agent-service
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
      
      - name: Build and Push Plaid Integration Service Image
        id: build-plaid-integration-service
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/plaid-integration-service:${{ github.sha }}"
          docker build -t $IMAGE_URI ./services/plaid-integration-service
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

  # =================================================================================
  # JOB 2: Deploy Backend Services to Cloud Run with Vault Integration
  # =================================================================================
  deploy-backend:
    name: Deploy Backend Services
    runs-on: ubuntu-latest
    needs: build-backend-images
    outputs:
      api_gateway_url: ${{ steps.deploy-api-gateway.outputs.url }}

    steps:
      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Deploy User Service (Internal)
        id: deploy-user-service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'user-service'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-backend-images.outputs.user_service_image_uri }}
          flags: --ingress=internal-and-cloud-load-balancing --min-instances=1
          secrets:
            - name: VAULT_SECRET_ID
              secret: USER_SERVICE_VAULT_SECRET_ID
          env_vars: |
            NODE_ENV=production
            PORT=8080
            VAULT_ADDR=${{ secrets.VAULT_ADDR }}
            VAULT_ROLE_ID=${{ secrets.USER_SERVICE_VAULT_ROLE_ID }}
            OTEL_SERVICE_NAME=user-service
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

      - name: Deploy Accounts Service (Internal)
        id: deploy-accounts-service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'accounts-service'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-backend-images.outputs.accounts_service_image_uri }}
          flags: --ingress=internal-and-cloud-load-balancing --min-instances=1
          secrets:
            - name: VAULT_SECRET_ID
              secret: ACCOUNTS_SERVICE_VAULT_SECRET_ID
          env_vars: |
            NODE_ENV=production
            PORT=8080
            VAULT_ADDR=${{ secrets.VAULT_ADDR }}
            VAULT_ROLE_ID=${{ secrets.ACCOUNTS_SERVICE_VAULT_ROLE_ID }}
            OTEL_SERVICE_NAME=accounts-service
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

      - name: Deploy Transactions Service (Internal)
        id: deploy-transactions-service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'transactions-service'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-backend-images.outputs.transactions_service_image_uri }}
          flags: --ingress=internal-and-cloud-load-balancing --min-instances=1
          secrets:
            - name: VAULT_SECRET_ID
              secret: TRANSACTIONS_SERVICE_VAULT_SECRET_ID
          env_vars: |
            NODE_ENV=production
            PORT=8080
            VAULT_ADDR=${{ secrets.VAULT_ADDR }}
            VAULT_ROLE_ID=${{ secrets.TRANSACTIONS_SERVICE_VAULT_ROLE_ID }}
            OTEL_SERVICE_NAME=transactions-service
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

      - name: Deploy AI Agent Service (Internal)
        id: deploy-ai-agent-service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'ai-agent-service'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-backend-images.outputs.ai_agent_service_image_uri }}
          flags: --ingress=internal-and-cloud-load-balancing
          secrets:
            - name: VAULT_SECRET_ID
              secret: AI_AGENT_SERVICE_VAULT_SECRET_ID
          env_vars: |
            NODE_ENV=production
            PORT=8080
            VAULT_ADDR=${{ secrets.VAULT_ADDR }}
            VAULT_ROLE_ID=${{ secrets.AI_AGENT_SERVICE_VAULT_ROLE_ID }}
            OTEL_SERVICE_NAME=ai-agent-service
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

      - name: Deploy Plaid Integration Service (Internal)
        id: deploy-plaid-integration-service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'plaid-integration-service'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-backend-images.outputs.plaid_integration_service_image_uri }}
          flags: --ingress=internal-and-cloud-load-balancing
          secrets:
            - name: VAULT_SECRET_ID
              secret: PLAID_SERVICE_VAULT_SECRET_ID
          env_vars: |
            NODE_ENV=production
            PORT=8080
            VAULT_ADDR=${{ secrets.VAULT_ADDR }}
            VAULT_ROLE_ID=${{ secrets.PLAID_SERVICE_VAULT_ROLE_ID }}
            OTEL_SERVICE_NAME=plaid-integration-service
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

      - name: Deploy API Gateway (Public)
        id: deploy-api-gateway
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'api-gateway'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-backend-images.outputs.api_gateway_image_uri }}
          flags: --allow-unauthenticated --min-instances=1
          secrets:
            - name: VAULT_SECRET_ID
              secret: API_GATEWAY_VAULT_SECRET_ID
          env_vars: |
            NODE_ENV=production
            PORT=8080
            FRONTEND_URL=${{ secrets.GCS_BUCKET_URL }}
            VAULT_ADDR=${{ secrets.VAULT_ADDR }}
            VAULT_ROLE_ID=${{ secrets.API_GATEWAY_VAULT_ROLE_ID }}
            OTEL_SERVICE_NAME=api-gateway
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
            USERS_SERVICE_URL=${{ steps.deploy-user-service.outputs.url }}/graphql
            ACCOUNTS_SERVICE_URL=${{ steps.deploy-accounts-service.outputs.url }}/graphql
            TRANSACTIONS_SERVICE_URL=${{ steps.deploy-transactions-service.outputs.url }}/graphql
            AI_AGENT_SERVICE_URL=${{ steps.deploy-ai-agent-service.outputs.url }}/graphql
            PLAID_INTEGRATION_SERVICE_URL=${{ steps.deploy-plaid-integration-service.outputs.url }}/graphql

  # =================================================================================
  # JOB 3: Build and Deploy Micro-Frontends to GCS
  # =================================================================================
  build-and-deploy-frontend-mfes:
    name: Build & Deploy Micro-Frontends
    runs-on: ubuntu-latest
    needs: deploy-backend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Micro-Frontends
        env:
          VITE_GRAPHQL_GATEWAY_URL: ${{ needs.deploy-backend.outputs.api_gateway_url }}/graphql
          VITE_MFE_DASHBOARD_URL: ${{ secrets.GCS_BUCKET_URL }}/dashboard/remoteEntry.js
          VITE_MFE_TRANSACTIONS_URL: ${{ secrets.GCS_BUCKET_URL }}/transactions/remoteEntry.js
          VITE_MFE_INVESTMENTS_URL: ${{ secrets.GCS_BUCKET_URL }}/investments/remoteEntry.js
          VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          VITE_OTEL_SERVICE_NAME: 'frontend-client'
          VITE_AUTH0_DOMAIN: ${{ secrets.VITE_AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.VITE_AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ secrets.VITE_AUTH0_AUDIENCE }}
        run: |
          npm run build --workspace=mfe-shell
          npm run build --workspace=mfe-dashboard
          npm run build --workspace=mfe-transactions
          npm run build --workspace=mfe-investments
          
      - name: Deploy MFEs to Google Cloud Storage
        run: |
          gsutil -m rsync -r ./mfe-shell/dist gs://${{ secrets.GCS_BUCKET_NAME }}/
          gsutil -m rsync -r ./mfe-dashboard/dist gs://${{ secrets.GCS_BUCKET_NAME }}/dashboard
          gsutil -m rsync -r ./mfe-transactions/dist gs://${{ secrets.GCS_BUCKET_NAME }}/transactions
          gsutil -m rsync -r ./mfe-investments/dist gs://${{ secrets.GCS_BUCKET_NAME }}/investments

      - name: Make GCS Bucket Publicly Readable
        run: gsutil iam ch allUsers:objectViewer gs://${{ secrets.GCS_BUCKET_NAME }}

      - name: Output Deployed URL
        run: echo "Frontend available at: ${{ secrets.GCS_BUCKET_URL }}/index.html"
