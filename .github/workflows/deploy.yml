# .github/workflows/deploy.yml - RE-ARCHITECTED
# This GitHub Actions workflow orchestrates the deployment of the entire microservices architecture.
# It aligns with a secure, multi-service, cloud-native deployment strategy.
#
# Architectural Changes Reflected:
# 1. Monorepo Support: Builds and deploys multiple services from the monorepo.
# 2. Microservice Deployment: Each service (API Gateway, User Service, etc.) is deployed independently to Cloud Run.
# 3. Security Hardening:
#    - Subgraph services are deployed with internal-only ingress, preventing direct public access.
#    - Secrets are managed via Google Secret Manager and injected at runtime, not passed as plaintext environment variables.
# 4. Dependency Management: Deployment is sequenced to ensure subgraphs are available before the API Gateway that consumes them.

name: CI/CD for Monorepo Services

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: 'read'
  pages: 'write'
  id-token: 'write'

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  # =================================================================================
  # JOB 1: Build and Push Docker Images
  # This job builds container images for all backend services and pushes them to
  # Google Artifact Registry. It runs steps sequentially to provide clear, distinct
  # outputs for each service's image URI.
  # =================================================================================
  build-and-push-images:
    name: Build & Push Service Images
    runs-on: ubuntu-latest
    outputs:
      api_gateway_image_uri: ${{ steps.build-api-gateway.outputs.image_uri }}
      user_service_image_uri: ${{ steps.build-user-service.outputs.image_uri }}
      accounts_service_image_uri: ${{ steps.build-accounts-service.outputs.image_uri }}
      transactions_service_image_uri: ${{ steps.build-transactions-service.outputs.image_uri }}
      ai_agent_service_image_uri: ${{ steps.build-ai-agent-service.outputs.image_uri }}
      plaid_integration_service_image_uri: ${{ steps.build-plaid-integration-service.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Google Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker for Google Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GAR_LOCATION }}-docker.pkg.dev

      - name: Build and Push API Gateway Image
        id: build-api-gateway
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/api-gateway:${{ github.sha }}"
          docker build -t $IMAGE_URI ./api-gateway
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build and Push User Service Image
        id: build-user-service
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/user-service:${{ github.sha }}"
          docker build -t $IMAGE_URI ./services/user-service
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build and Push Accounts Service Image
        id: build-accounts-service
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/accounts-service:${{ github.sha }}"
          docker build -t $IMAGE_URI ./services/accounts-service
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build and Push Transactions Service Image
        id: build-transactions-service
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/transactions-service:${{ github.sha }}"
          docker build -t $IMAGE_URI ./services/transactions-service
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Build and Push AI Agent Service Image
        id: build-ai-agent-service
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/ai-agent-service:${{ github.sha }}"
          docker build -t $IMAGE_URI ./services/ai-agent-service
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
      
      - name: Build and Push Plaid Integration Service Image
        id: build-plaid-integration-service
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/plaid-integration-service:${{ github.sha }}"
          docker build -t $IMAGE_URI ./services/plaid-integration-service
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

  # =================================================================================
  # JOB 2: Deploy Backend Services
  # This job deploys all backend services to Google Cloud Run in sequence.
  # Subgraphs are deployed first with internal-only ingress. The API Gateway is
  # deployed last, configured with the internal URLs of the subgraphs.
  # =================================================================================
  deploy-backend-services:
    name: Deploy Backend Services
    runs-on: ubuntu-latest
    needs: build-and-push-images
    outputs:
      api_gateway_url: ${{ steps.deploy-api-gateway.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Deploy User Service
        id: deploy-user-service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'user-service'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-and-push-images.outputs.user_service_image_uri }}
          flags: --ingress=internal-and-cloud-load-balancing
          secrets:
            - name: DATABASE_URL
              secret: USER_SERVICE_DB_URL
            - name: KAFKA_BROKERS
              secret: KAFKA_BROKERS
          env_vars: |
            NODE_ENV=production
            PORT=8080
            OTEL_SERVICE_NAME=user-service
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

      - name: Deploy Accounts Service
        id: deploy-accounts-service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'accounts-service'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-and-push-images.outputs.accounts_service_image_uri }}
          flags: --ingress=internal-and-cloud-load-balancing
          secrets:
            - name: DATABASE_URL
              secret: ACCOUNTS_SERVICE_DB_URL
            - name: KAFKA_BROKERS
              secret: KAFKA_BROKERS
            - name: JWT_SECRET
              secret: JWT_SECRET
          env_vars: |
            NODE_ENV=production
            PORT=8080
            OTEL_SERVICE_NAME=accounts-service
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

      - name: Deploy Transactions Service
        id: deploy-transactions-service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'transactions-service'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-and-push-images.outputs.transactions_service_image_uri }}
          flags: --ingress=internal-and-cloud-load-balancing
          secrets:
            - name: DATABASE_URL
              secret: TRANSACTIONS_SERVICE_DB_URL
            - name: KAFKA_BROKERS
              secret: KAFKA_BROKERS
          env_vars: |
            NODE_ENV=production
            PORT=8080
            OTEL_SERVICE_NAME=transactions-service
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
      
      - name: Deploy AI Agent Service
        id: deploy-ai-agent-service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'ai-agent-service'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-and-push-images.outputs.ai_agent_service_image_uri }}
          flags: --ingress=internal-and-cloud-load-balancing
          secrets:
            - name: GOOGLE_GENAI_API_KEY
              secret: GOOGLE_GENAI_API_KEY
            - name: KAFKA_BROKERS
              secret: KAFKA_BROKERS
          env_vars: |
            NODE_ENV=production
            PORT=8080
            OTEL_SERVICE_NAME=ai-agent-service
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

      - name: Deploy Plaid Integration Service
        id: deploy-plaid-integration-service
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'plaid-integration-service'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-and-push-images.outputs.plaid_integration_service_image_uri }}
          flags: --ingress=internal-and-cloud-load-balancing
          secrets:
            - name: DATABASE_URL
              secret: PLAID_INTEGRATION_DB_URL
            - name: KAFKA_BROKERS
              secret: KAFKA_BROKERS
            - name: PLAID_CLIENT_ID
              secret: PLAID_CLIENT_ID
            - name: PLAID_SECRET
              secret: PLAID_SECRET
            - name: PLAID_ENV
              secret: PLAID_ENV
          env_vars: |
            NODE_ENV=production
            PORT=8080
            OTEL_SERVICE_NAME=plaid-integration-service
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}

      - name: Deploy API Gateway
        id: deploy-api-gateway
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'api-gateway'
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-and-push-images.outputs.api_gateway_image_uri }}
          flags: --allow-unauthenticated # This is the public entry point for now
          secrets:
            - name: JWT_SECRET
              secret: JWT_SECRET
            - name: SUBGRAPH_API_KEY
              secret: SUBGRAPH_API_KEY
          env_vars: |
            NODE_ENV=production
            PORT=8080
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            OTEL_SERVICE_NAME=api-gateway
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
            USERS_SERVICE_URL=${{ steps.deploy-user-service.outputs.url }}/graphql
            ACCOUNTS_SERVICE_URL=${{ steps.deploy-accounts-service.outputs.url }}/graphql
            TRANSACTIONS_SERVICE_URL=${{ steps.deploy-transactions-service.outputs.url }}/graphql
            AI_AGENT_SERVICE_URL=${{ steps.deploy-ai-agent-service.outputs.url }}/graphql
            PLAID_INTEGRATION_SERVICE_URL=${{ steps.deploy-plaid-integration-service.outputs.url }}/graphql

  # =================================================================================
  # JOB 3: Build and Deploy Frontend
  # This job builds the static frontend, injecting the URL of the newly deployed
  # API Gateway, and then deploys the assets to GitHub Pages.
  # =================================================================================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend-services
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          # VITE_BFF_URL is kept for compatibility with the existing frontend code.
          # It now points to the new, publicly accessible API Gateway.
          VITE_BFF_URL: ${{ needs.deploy-backend-services.outputs.api_gateway_url }}
          VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          VITE_OTEL_SERVICE_NAME: 'frontend-client'
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
