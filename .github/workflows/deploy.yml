# .github/workflows/deploy.yml
# This GitHub Actions workflow handles the continuous deployment for the DemoBank application.
# It orchestrates a sequential deployment:
# 1. Build and push Docker images for all backend services.
# 2. Deploy the backend services to a cloud provider (e.g., Google Cloud Run).
# 3. Build and deploy the frontend application, injecting the newly deployed backend URL.

name: CI/CD for DemoBank Services

on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Grant GITHUB_TOKEN the permissions required for GCloud authentication and Pages deployment
permissions:
  contents: 'read'
  pages: 'write'
  id-token: 'write'

# Allow only one concurrent deployment, but do not cancel in-progress runs
# to ensure production deployments always complete.
concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  # =================================================================================
  # JOB 1: Build and Push Docker Images
  # This job builds container images for backend services and pushes them to a registry.
  # It outputs the unique image URI for each service to be used in the deploy job.
  # =================================================================================
  build-and-push-images:
    name: Build & Push Service Images
    runs-on: ubuntu-latest
    outputs:
      bff_image_uri: ${{ steps.build-bff.outputs.image_uri }}
      # In a full microservices architecture, add more outputs for other subgraphs:
      # users_image_uri: ${{ steps.build-users.outputs.image_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Authenticate to Google Cloud using Workload Identity Federation ---
      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up Google Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker for Google Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GAR_LOCATION }}-docker.pkg.dev

      # --- Build and Push BFF Service Image ---
      - name: Build and Push BFF Image
        id: build-bff
        run: |
          IMAGE_URI="${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/demobank/bff:${{ github.sha }}"
          docker build -t $IMAGE_URI ./bff
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
      # Add similar steps for other microservices (subgraphs) here

  # =================================================================================
  # JOB 2: Deploy Backend Services
  # This job takes the container images from the previous job and deploys them to
  # the hosting environment (Google Cloud Run). It outputs the public URL of the
  # gateway/BFF to be used by the frontend.
  # =================================================================================
  deploy-backend:
    name: Deploy Backend Services
    runs-on: ubuntu-latest
    needs: build-and-push-images
    outputs:
      bff_url: ${{ steps.deploy-bff.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Deploy BFF to Cloud Run
        id: deploy-bff
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'bff' # The name of the Cloud Run service
          region: ${{ secrets.GCP_REGION }}
          image: ${{ needs.build-and-push-images.outputs.bff_image_uri }}
          env_vars: |
            NODE_ENV=production
            PORT=8080
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            PLAID_CLIENT_ID=${{ secrets.PLAID_CLIENT_ID }}
            PLAID_SECRET=${{ secrets.PLAID_SECRET }}
            PLAID_ENV=sandbox
            OTEL_SERVICE_NAME=bff-service
            OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          # The BFF is a public API in this architecture. Use IAM for private services.
          flags: --allow-unauthenticated
      # Add similar steps to deploy other subgraph services here

  # =================================================================================
  # JOB 3: Build and Deploy Frontend
  # This job builds the static frontend, injecting the URL of the newly deployed
  # backend, and then deploys the assets to GitHub Pages.
  # =================================================================================
  deploy-frontend:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          # Use the dynamic URL from the deployed backend service
          VITE_BFF_URL: ${{ needs.deploy-backend.outputs.bff_url }}
          VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          VITE_OTEL_SERVICE_NAME: 'frontend-client'
        run: npm run build

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
