const geminiService = new GeminiService('YOUR_GEMINI_API_KEY_HERE'); // Replace with actual key in a real app

// ================================================================================================
// PHASE 3: API CLIENT / SDK GENERATION
// This section provides a basic HTTP client and SDK functions derived from OpenAPI paths.
// Each SDK function calls GeminiService to enrich data on ingress or egress.
// ================================================================================================

export type ApiClientConfig = {
  baseUrl: string;
  authHeader?: string;
  geminiService: GeminiService; // Inject Gemini service
};

export class ApiClient {
  private config: ApiClientConfig;

  constructor(config: ApiClientConfig) {
    this.config = config;
  }

  private async request<T>(
    method: 'GET' | 'POST' | 'PUT' | 'DELETE',
    path: string,
    params?: Record<string, any>,
    body?: Record<string, any>,
    headers?: Record<string, string>,
    isFormUrlEncoded: boolean = false
  ): Promise<T> {
    const url = new URL(`${this.config.baseUrl}${path}`);

    // Process query parameters
    if (params) {
      Object.entries(params).forEach(([key, value]) => {
        if (value !== undefined && value !== null) {
          url.searchParams.append(key, String(value));
        }
      });
    }

    const requestHeaders: Record<string, string> = {
      ...headers,
    };
    if (isFormUrlEncoded) {
      requestHeaders['Content-Type'] = 'application/x-www-form-urlencoded';
    } else if (body) { // Only set JSON content type if there's a body and it's not form-urlencoded
      requestHeaders['Content-Type'] = 'application/json';
    }

    if (this.config.authHeader) {
      requestHeaders['Authorization'] = this.config.authHeader;
    }

    const fetchOptions: RequestInit = {
      method,
      headers: requestHeaders,
    };

    if (body) {
      fetchOptions.body = isFormUrlEncoded ? new URLSearchParams(body).toString() : JSON.stringify(body);
    }

    console.log(`[ApiClient] Making ${method} request to ${url.toString()}`);

    try {
      const response = await fetch(url.toString(), fetchOptions);

      if (!response.ok) {
        const errorData: Error = await response.json().catch(() => ({ code: 'unknown', message: response.statusText }));
        errorData.ai_diagnosis = await this.config.geminiService.analyzeErrorDiagnosis(errorData); // Gemini integration for errors
        throw new Error(`API Error ${response.status}: ${errorData.message} (Code: ${errorData.code}) ${errorData.ai_diagnosis ? `AI Diagnosis: ${errorData.ai_diagnosis}` : ''}`);
      }

      if (response.status === 204) {
        return {} as T;
      }

      const data: T = await response.json();
      return data;
    } catch (error) {
      console.error(`[ApiClient] Request failed for ${method} ${path}:`, error);
      throw error;
    }
  }

  // ============================================================================
  // SDK FUNCTIONS (Derived from OpenAPI Paths - with Gemini Integration)
  // Each function maps to an OpenAPI operationId
  // ============================================================================

  // Users & Authentication
  async getAccessToken(body: { grant_type: string; code?: string; redirect_uri?: string; client_id?: string }): Promise<OAuthToken> {
    const token = await this.request<OAuthToken>('POST', '/auth/token', undefined, body, undefined, true);
    token.ai_security_context = await this.config.geminiService.analyzeOAuthTokenSecurity(token);
    return token;
  }

  async revokeToken(body: { token: string; token_type_hint?: 'access_token' | 'refresh_token' }): Promise<void> {
    await this.request<void>('POST', '/auth/revoke', undefined, body, undefined, true);
    // Gemini: Log token revocation and potential security implications
  }

  async getCurrentUser(): Promise<User> {
    const user = await this.request<User>('GET', '/users/me');
    const { ai_profile_summary, ai_spending_patterns } = await this.config.geminiService.analyzeUserProfile(user);
    user.ai_profile_summary = ai_profile_summary;
    user.ai_spending_patterns = ai_spending_patterns;
    user.gamification!.ai_next_milestone_suggestion = await this.config.geminiService.suggestNextGamificationMilestone(user.gamification!);
    user.notificationPreferences!.ai_optimization_recommendation = await this.config.geminiService.recommendNotificationOptimization(user.notificationPreferences!);
    return user;
  }

  async updateCurrentUser(body: UserUpdate): Promise<User> {
    body.ai_impact_analysis = await this.config.geminiService.analyzeUserUpdateImpact(body); // Gemini pre-request analysis
    const updatedUser = await this.request<User>('PUT', '/users/me', undefined, body);
    const { ai_profile_summary, ai_spending_patterns } = await this.config.geminiService.analyzeUserProfile(updatedUser);
    updatedUser.ai_profile_summary = ai_profile_summary;
    updatedUser.ai_spending_patterns = ai_spending_patterns;
    return updatedUser;
  }

  async changePassword(body: { currentPassword: string; newPassword: string }): Promise<void> {
    // Gemini: Pre-request password strength check or security assessment
    await this.request<void>('PUT', '/users/me/password', undefined, body);
  }

  async setup2FA(): Promise<{ secret?: string; qrCodeUri?: string }> {
    const data = await this.request<{ secret?: string; qrCodeUri?: string }>('POST', '/users/me/2fa');
