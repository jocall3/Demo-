  async getLoginHistory(params?: { limit?: number; offset?: number }): Promise<{ limit?: number; offset?: number; total?: number; data?: LoginHistoryEvent[] }> {
    const history = await this.request<{ limit?: number; offset?: number; total?: number; data?: LoginHistoryEvent[] }>('GET', '/users/me/login-history', params);
    if (history.data) {
      for (const event of history.data) {
        const { ai_anomaly_flag, ai_risk_score, ai_geographical_risk } = await this.config.geminiService.analyzeLoginHistoryEvent(event);
        event.ai_anomaly_flag = ai_anomaly_flag;
        event.ai_risk_score = ai_risk_score;
        event.ai_geographical_risk = ai_geographical_risk;
      }
    }
    return history;
