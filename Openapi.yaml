// Custom provider to ensure ApiClient's authHeader is reactive to AuthContext changes
// This effectively makes the API client "aware" of the current auth state.
const ApiClientContext = createContext<ApiClient | undefined>(undefined);
const DynamicApiClientProvider: React.FC<React.PropsWithChildren<{ apiClient: ApiClient }>> = ({ children, apiClient }) => {
  const { token } = useAuth();

  useEffect(() => {
    if (token) {
      apiClient.config.authHeader = `Bearer ${token}`;
    } else {
      delete apiClient.config.authHeader;
    }
    console.log("[DynamicApiClientProvider] API Client auth header updated.");
  }, [token, apiClient]);

  return (
    <ApiClientContext.Provider value={apiClient}>
      {children}
    </ApiClientContext.Provider>
  );
};

// Main application entry point that provides all contexts
const RootApp: React.FC = () => {
  // Memoize the API client instance to ensure it's stable across renders
  const apiClient = useMemo(() => new ApiClient({
    baseUrl: 'https://api.demobank.com/v1', // This should point to your actual backend API
    geminiService: geminiService,
  }), []);

  return (
    <div style={styles.app}>
      <AuthProvider apiClient={apiClient}>
        <DynamicApiClientProvider apiClient={apiClient}>
          <GraphQLProvider apiClient={apiClient}>
            <WebSocketProvider apiClient={apiClient}>
              <Home />
            </WebSocketProvider>
          </GraphQLProvider>
        </DynamicApiClientProvider>
      </AuthProvider>
    </div>
  );
};


