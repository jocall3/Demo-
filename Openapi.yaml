  async getCreditHealth(): Promise<CreditHealthReport> {
    const report = await this.request<CreditHealthReport>('GET', '/security/credit-health');
    if (report.factors) {
      for (const factor of report.factors) {
        const { ai_improvement_tip, ai_impact_on_score } = await this.config.geminiService.getCreditHealthImprovementTips(factor);
        factor.ai_improvement_tip = ai_improvement_tip;
        factor.ai_impact_on_score = ai_impact_on_score;
      }
