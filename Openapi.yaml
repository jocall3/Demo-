        case 'pitchToQuantumWeaver': if (variables?.pitchRequest) return await apiClient.pitchToQuantumWeaver(variables.pitchRequest) as GraphQLMutationOperations[K]; throw new Error('Missing pitchRequest');
        case 'submitWeaverAssessment': if (variables?.pitchId && variables?.answers) return await apiClient.submitWeaverAssessment(variables.pitchId, { answers: variables.answers }) as GraphQLMutationOperations[K]; throw new Error('Missing pitchId or answers');
        case 'approveWeaverFunding': if (variables?.pitchId) return await apiClient.approveWeaverFunding(variables.pitchId) as GraphQLMutationOperations[K]; throw new Error('Missing pitchId');
        case 'generateVideoAd': if (variables?.generateVideoRequest) return await apiClient.generateVideoAd(variables.generateVideoRequest) as GraphQLMutationOperations[K]; throw new Error('Missing generateVideoRequest');
        case 'generateCTASuggestions': if (variables?.prompt) return await apiClient.generateCTASuggestions(variables as any) as GraphQLMutationOperations[K]; throw new Error('Missing prompt');
        case 'generateAppBackground': if (variables?.generateImageRequest) return await apiClient.generateAppBackground(variables.generateImageRequest) as GraphQLMutationOperations[K]; throw new Error('Missing generateImageRequest');
        case 'editCardDesign': if (variables?.editImageRequest) return await apiClient.editCardDesign(variables.editImageRequest) as GraphQLMutationOperations[K]; throw new Error('Missing editImageRequest');
        case 'generateCardStory': if (variables?.designPrompt) return await apiClient.generateCardStory(variables as any) as GraphQLMutationOperations[K]; throw new Error('Missing designPrompt');
        case 'simulatePurchaseImpact': if (variables?.productId) return await apiClient.simulatePurchaseImpact(variables.productId) as GraphQLMutationOperations[K]; throw new Error('Missing productId');
