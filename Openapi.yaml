    // Gemini: Provide insights into status change, potential consequences
    const updatedAnomaly = await this.request<FinancialAnomaly>('PUT', `/corporate/anomalies/${anomalyId}/status`, undefined, body);
    const { ai_remediation_suggestions, ai_root_cause_analysis } = await this.config.geminiService.suggestAnomalyRemediation(updatedAnomaly);
    updatedAnomaly.ai_remediation_suggestions = ai_remediation_suggestions;
