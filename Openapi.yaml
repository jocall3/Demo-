        case 'revokeOpenBankingConnection': if (variables?.connectionId) return await apiClient.revokeOpenBankingConnection(variables.connectionId) as GraphQLMutationOperations[K]; throw new Error('Missing connectionId');
        default: throw new Error(`[GraphQLClient] Unhandled mutation operation: ${String(operationName)}`);
      }
    } catch (error) {
      console.error("[GraphQLClient] Mutation failed:", error);
      throw error;
    }
  }, [apiClient]);

  const value = useMemo(() => ({ query, mutate }), [query, mutate]);

  return (
    <GraphQLContext.Provider value={value}>
      {children}
    </GraphQLContext.Provider>
  );
};


// ================================================================================================
// PHASE 5: WEBHOOKS (Simulated via WebSocket)
// This simulates a WebSocket client listening for server-pushed events that act like webhooks.
// Each incoming event is also processed by Gemini.
// ================================================================================================

export type WebhookEvent =
  | { type: 'TRANSACTION_CREATED'; payload: Transaction & { ai_insights: string } }
  | { type: 'ACCOUNT_UPDATED'; payload: LinkedAccount & { ai_health_alert: string } }
  | { type: 'NOTIFICATION_RECEIVED'; payload: Notification & { ai_priority_alert: string } }
  | { type: 'GOAL_PROGRESS_UPDATE'; payload: FinancialGoal & { ai_projection: string } }
  | { type: 'AI_INSIGHT_AVAILABLE'; payload: { entityType: string; entityId: string; insight: string; ai_source_confidence: number } }
  | { type: 'SECURITY_ALERT'; payload: { type: string; details: string; timestamp: string; ai_action_recommendation: string } }
  | { type: 'WEAVER_PITCH_STATUS_UPDATE'; payload: QuantumWeaverState & { ai_update_summary: string } }
  | { type: 'CORPORATE_ANOMALY_DETECTED'; payload: FinancialAnomaly & { ai_severity_rating: string } }
  | { type: 'CRYPTO_BALANCE_UPDATE'; payload: WalletInfo & { ai_market_alert: string } }
  | { type: 'MARKETPLACE_RECOMMENDATION_NEW'; payload: MarketplaceProduct & { ai_relevance_score: number } }
  | { type: 'GENERIC_MESSAGE'; payload: { message: string; timestamp: string; ai_sentiment_analysis: string } };

interface WebSocketContextType {
  latestEvent: WebhookEvent | null;
  events: WebhookEvent[];
  isConnected: boolean;
  error: string | null;
  connect: () => void;
  disconnect: () => void;
}

const WebSocketContext = createContext<WebSocketContextType | undefined>(undefined);

export const useWebSockets = () => {
  const context = useContext(WebSocketContext);
  if (!context) {
    throw new Error('useWebSockets must be used within a WebSocketProvider');
  }
  return context;
};

// Simulated WebSocket Provider
export const WebSocketProvider: React.FC<React.PropsWithChildren<{ apiClient: ApiClient }>> = ({ children, apiClient }) => {
  const [socket, setSocket] = useState<WebSocket | null>(null);
  const [isConnected, setIsConnected] = useState(false);
  const [latestEvent, setLatestEvent] = useState<WebhookEvent | null>(null);
  const [events, setEvents] = useState<WebhookEvent[]>([]);
  const [error, setError] = useState<string | null>(null);

  const websocketUrl = 'ws://localhost:8080/ws/webhooks'; // Conceptual WebSocket endpoint

  const connect = useCallback(() => {
    if (socket && (socket.readyState === WebSocket.OPEN || socket.readyState === WebSocket.CONNECTING)) {
      console.log("[WebSocket] Already connected or connecting.");
      return;
    }

    console.log("[WebSocket] Attempting to connect...");
    const ws = new WebSocket(websocketUrl);

    ws.onopen = () => {
      console.log('[WebSocket] Connected');
      setIsConnected(true);
      setError(null);
    };

    ws.onmessage = async (event) => {
      try {
        const parsedEvent: WebhookEvent = JSON.parse(event.data);
        console.log('[WebSocket] Received event:', parsedEvent.type, parsedEvent.payload);

        // Simulate Gemini integration for incoming webhook data
        let enrichedPayload = parsedEvent.payload as any; // Use any for dynamic assignment
        switch (parsedEvent.type) {
          case 'TRANSACTION_CREATED':
            const txInsights = await apiClient.config.geminiService.getTransactionInsights(parsedEvent.payload);
            enrichedPayload = { ...parsedEvent.payload, ai_insights: txInsights.ai_categorization_suggestion };
            break;
          case 'ACCOUNT_UPDATED':
            const { ai_health_assessment } = await apiClient.config.geminiService.assessAccountBalanceHealth(parsedEvent.payload.balance || {});
            enrichedPayload = { ...parsedEvent.payload, ai_health_alert: ai_health_assessment };
            break;
          case 'NOTIFICATION_RECEIVED':
            const priority = await apiClient.config.geminiService.prioritizeNotification(parsedEvent.payload);
            enrichedPayload = { ...parsedEvent.payload, ai_priority_alert: priority };
            break;
          case 'GOAL_PROGRESS_UPDATE':
            const { ai_progress_analysis } = await apiClient.config.geminiService.analyzeFinancialGoalProgress(parsedEvent.payload);
            enrichedPayload = { ...parsedEvent.payload, ai_projection: ai_progress_analysis };
            break;
          case 'SECURITY_ALERT':
            const action = await apiClient.config.geminiService.generateText(`Recommend action for security alert: ${parsedEvent.payload.details}`);
            enrichedPayload = { ...parsedEvent.payload, ai_action_recommendation: action };
            break;
          case 'WEAVER_PITCH_STATUS_UPDATE':
              const summary = await apiClient.config.geminiService.generateText(`Summarize Weaver pitch update for stage: ${parsedEvent.payload.stage}`);
              enrichedPayload = { ...parsedEvent.payload, ai_update_summary: summary };
              break;
          case 'CORPORATE_ANOMALY_DETECTED':
              const { riskScore } = await apiClient.config.geminiService.analyzeData('FinancialAnomaly', parsedEvent.payload);
              enrichedPayload = { ...parsedEvent.payload, ai_severity_rating: riskScore && riskScore > 75 ? 'High' : (riskScore && riskScore > 40 ? 'Medium' : 'Low') };
              break;
          case 'CRYPTO_BALANCE_UPDATE':
              const marketAlert = await apiClient.config.geminiService.generateText(`Generate market alert for crypto balance update for ${parsedEvent.payload.primaryAsset} at ${parsedEvent.payload.balance}`);
              enrichedPayload = { ...parsedEvent.payload, ai_market_alert: marketAlert };
              break;
          case 'MARKETPLACE_RECOMMENDATION_NEW':
              const relevanceScore = Math.floor(Math.random() * 100); // Mock
              enrichedPayload = { ...parsedEvent.payload, ai_relevance_score: relevanceScore };
              break;
          case 'GENERIC_MESSAGE':
              const sentimentAnalysis = await apiClient.config.geminiService.generateText(`Analyze sentiment for generic message: ${parsedEvent.payload.message}`);
              enrichedPayload = { ...parsedEvent.payload, ai_sentiment_analysis: sentimentAnalysis };
              break;
          case 'AI_INSIGHT_AVAILABLE': // This type itself is AI-generated
              enrichedPayload = { ...parsedEvent.payload, ai_source_confidence: Math.floor(Math.random() * 100) }; // Add confidence score
              break;
        }

        setLatestEvent({ ...parsedEvent, payload: enrichedPayload });
        setEvents((prev) => [...prev, { ...parsedEvent, payload: enrichedPayload }]);
      } catch (err) {
        console.error('[WebSocket] Failed to parse message:', err);
        setError('Failed to parse incoming message.');
      }
    };

    ws.onclose = (e) => {
      console.log('[WebSocket] Disconnected:', e.code, e.reason);
      setIsConnected(false);
      if (!e.wasClean) {
        setError('WebSocket connection closed unexpectedly. Reconnecting in 5 seconds...');
        setTimeout(connect, 5000); // Attempt to reconnect
      }
    };

    ws.onerror = (err) => {
      console.error('[WebSocket] Error:', err);
      setError('WebSocket error. Check console for details.');
      ws.close();
    };

    setSocket(ws);
  }, [websocketUrl, apiClient]);

  const disconnect = useCallback(() => {
    if (socket) {
      console.log("[WebSocket] Disconnecting...");
      socket.close(1000, "User initiated disconnect");
    }
  }, [socket]);

  useEffect(() => {
    connect(); // Connect on component mount

    return () => {
      disconnect(); // Disconnect on component unmount
    };
  }, [connect, disconnect]);

  const value = useMemo(() => ({ latestEvent, events, isConnected, error, connect, disconnect }), [latestEvent, events, isConnected, error, connect, disconnect]);

  return (
    <WebSocketContext.Provider value={value}>
      {children}
    </WebSocketContext.Provider>
  );
};


// ================================================================================================
// PHASE 6: AUTHENTICATION CONTEXT (Simplified)
// ================================================================================================

interface AuthContextType {
  token: string | null;
  user: User | null;
  login: (code: string) => Promise<void>;
  logout: () => void;
  isAuthenticated: boolean;
  loading: boolean;
}

const AuthContext = createContext<AuthContextType | undefined>(undefined);

export const useAuth = () => {
  const context = useContext(AuthContext);
  if (!context) {
    throw new Error('useAuth must be used within an AuthProvider');
  }
  return context;
};

export const AuthProvider: React.FC<React.PropsWithChildren<{ apiClient: ApiClient }>> = ({ children, apiClient }) => {
  const [token, setToken] = useState<string | null>(localStorage.getItem('access_token'));
  const [user, setUser] = useState<User | null>(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const fetchUser = async () => {
      if (token) {
        try {
          // Temporarily set auth header for initial user fetch
          apiClient.config.authHeader = `Bearer ${token}`;
          const fetchedUser = await apiClient.getCurrentUser();
          setUser(fetchedUser);
        } catch (error) {
          console.error("Failed to fetch user:", error);
          setToken(null);
          localStorage.removeItem('access_token');
          localStorage.removeItem('refresh_token');
        } finally {
            delete apiClient.config.authHeader; // Clean up, as DynamicApiClientProvider will manage it
        }
      }
      setLoading(false);
    };
    fetchUser();
  }, [token, apiClient]);

  const login = useCallback(async (code: string) => {
    setLoading(true);
    try {
      const oauthToken = await apiClient.getAccessToken({
        grant_type: 'authorization_code',
        code,
        redirect_uri: 'http://localhost:3000/callback', // Replace with your app's redirect URI
        client_id: 'demobank-client', // Replace with your client ID
      });
      if (oauthToken.access_token) {
        setToken(oauthToken.access_token);
        localStorage.setItem('access_token', oauthToken.access_token);
        // User will be fetched by the useEffect listener
      }
    } catch (error) {
      console.error("Login failed:", error);
      throw error;
    } finally {
      setLoading(false);
    }
  }, [apiClient]);

  const logout = useCallback(() => {
    // In a real app, you'd call apiClient.revokeToken(token)
    setToken(null);
    setUser(null);
    localStorage.removeItem('access_token');
    localStorage.removeItem('refresh_token'); // If refresh tokens were stored
  }, []);

  const authContextValue = useMemo(() => ({
    token,
    user,
    login,
    logout,
    isAuthenticated: !!token,
    loading,
  }), [token, user, login, logout, loading]);

  return (
    <AuthContext.Provider value={authContextValue}>
      {children}
    </AuthContext.Provider>
  );
};


