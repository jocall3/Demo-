  // Accounts & Balances
  async listLinkedAccounts(): Promise<LinkedAccount[]> {
    const accounts = await this.request<LinkedAccount[]>('GET', '/accounts');
    for (const account of accounts) {
      const { ai_health_assessment, ai_liquidity_analysis } = await this.config.geminiService.assessAccountBalanceHealth(account.balance || {});
