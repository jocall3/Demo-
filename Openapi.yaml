// ================================================================================================
// PHASE 4: GRAPHQL LAYER (Conceptual Client-side Implementation)
// This simulates a GraphQL client that could query a backend GraphQL server.
// For a truly self-contained app.tsx, this would imply a client-side GraphQL resolver framework
// which is complex. We'll simplify by defining types and showing how it maps to the REST API.
// ================================================================================================

// 1. Define GraphQL Schema Types (simplified, directly mapping to OpenAPI types)
// In a real GraphQL setup, you'd use a schema definition language (SDL) and codegen.
// Here we'll represent the query/mutation structure.

export type GraphQLQueryOperations = {
  me: User;
  linkedAccounts: LinkedAccount[];
  transactions: PaginatedTransactions;
  budgets: Budget[];
  budgetById: Budget;
  financialGoals: FinancialGoal[];
  financialGoalById: FinancialGoal;
  chatSession: AIChatSession;
  chatHistory: { limit?: number; offset?: number; total?: number; data?: AIChatMessage[] };
  weaverPitchStatus: QuantumWeaverState;
  videoGenerationStatus: VideoOperationStatus;
  marketplaceRecommendations: MarketplaceProduct[];
  marketplaceProductById: MarketplaceProduct;
  rewardBalance: RewardPoints;
  gamificationStatus: GamificationState;
  listRewardItems: RewardItem[];
  walletInfo: WalletInfo;
  nfts: NFTAsset[];
  nftDetails: NFTAsset;
  corporateCards: { limit?: number; offset?: number; total?: number; data?: CorporateCard[] };
  corporateCardDetails: CorporateCard;
  corporateTransactions: { data?: CorporateTransaction[] };
  paymentOrders: PaymentOrder[];
  invoices: Invoice[];
  complianceRules: ComplianceRule[];
  complianceCases: ComplianceCase[];
  financialAnomalies: FinancialAnomaly[];
  notifications: Notification[];
  creditHealth: CreditHealthReport;
  openBankingConnections: OpenBankingConnection[];
};

export type GraphQLMutationOperations = {
  getAccessToken: OAuthToken;
  revokeToken: void;
  updateCurrentUser: User;
  changePassword: void;
  setup2FA: { secret?: string; qrCodeUri?: string };
  enable2FA: { recoveryCodes?: string[] };
  disable2FA: void;
  updateNotificationPreferences: NotificationPreferences;
  unlinkAccount: void;
  createManualTransaction: Transaction;
  updateTransaction: Transaction;
  deleteManualTransaction: void;
  detectSubscriptions: DetectedSubscription[];
  executeTrade: TradeConfirmation;
  projectPortfolioGrowth: GrowthSimulationResponse;
  createBudget: Budget;
  updateBudget: Budget;
  deleteBudget: void;
  createFinancialGoal: FinancialGoal;
  updateFinancialGoal: FinancialGoal;
  deleteFinancialGoal: void;
  contributeToFinancialGoal: FinancialGoal;
  generateAIGoalPlan: AIGoalPlan;
  startChatSession: AIChatSession;
  deleteChatSession: void;
  sendMessage: AIChatResponse;
  pitchToQuantumWeaver: QuantumWeaverState;
  submitWeaverAssessment: QuantumWeaverState;
  approveWeaverFunding: QuantumWeaverState; // Deprecated
  generateVideoAd: { operationId?: string };
  generateCTASuggestions: { suggestions?: string[] };
  generateAppBackground: GeneratedImageResponse;
  editCardDesign: GeneratedImageResponse;
  generateCardStory: { story?: string };
  simulatePurchaseImpact: PurchaseImpactAnalysis;
  redeemRewardItem: RewardPoints;
  connectWeb3Wallet: WalletInfo;
  getCryptoQuote: CryptoQuote;
  executeCryptoPurchase: CryptoPurchaseConfirmation;
  issueVirtualCard: VirtualCard;
  issueCorporateCard: CorporateCard;
  updateCorporateCardControls: CorporateCard;
  createPaymentOrder: PaymentOrder;
  reviewPaymentOrder: PaymentOrder;
  updateAnomalyStatus: FinancialAnomaly;
  markAllNotificationsRead: void;
  revokeOpenBankingConnection: void;
};


interface GraphQLContextType {
  query: <K extends keyof GraphQLQueryOperations>(
    operationName: K,
    variables?: Record<string, any>
  ) => Promise<GraphQLQueryOperations[K]>;
  mutate: <K extends keyof GraphQLMutationOperations>(
    operationName: K,
    variables?: Record<string, any>
  ) => Promise<GraphQLMutationOperations[K]>;
}

const GraphQLContext = createContext<GraphQLContextType | undefined>(undefined);

export const useGraphQL = () => {
  const context = useContext(GraphQLContext);
  if (!context) {
    throw new Error('useGraphQL must be used within a GraphQLProvider');
  }
  return context;
};

// Simplified GraphQL Provider
export const GraphQLProvider: React.FC<React.PropsWithChildren<{ apiClient: ApiClient }>> = ({ children, apiClient }) => {
  const query = useCallback(async <K extends keyof GraphQLQueryOperations>(
    operationName: K,
    variables?: Record<string, any>
  ): Promise<GraphQLQueryOperations[K]> => {
    console.log(`[GraphQLClient] Executing query: ${operationName}, variables: ${JSON.stringify(variables)}`);
    try {
      switch (operationName) {
        case 'me': return await apiClient.getCurrentUser() as GraphQLQueryOperations[K];
        case 'linkedAccounts': return await apiClient.listLinkedAccounts() as GraphQLQueryOperations[K];
        case 'transactions': return await apiClient.listTransactions(variables) as GraphQLQueryOperations[K];
        case 'budgets': return await apiClient.listBudgets() as GraphQLQueryOperations[K];
        case 'budgetById': if (variables?.id) return await apiClient.getBudgetById(variables.id) as GraphQLQueryOperations[K]; throw new Error('Missing budgetId');
        case 'financialGoals': return await apiClient.listFinancialGoals() as GraphQLQueryOperations[K];
        case 'financialGoalById': if (variables?.id) return await apiClient.getFinancialGoalById(variables.id) as GraphQLQueryOperations[K]; throw new Error('Missing goalId');
        case 'chatSession': if (variables?.sessionId) return await apiClient.getChatSession(variables.sessionId) as GraphQLQueryOperations[K]; throw new Error('Missing sessionId');
        case 'chatHistory': if (variables?.sessionId) return await apiClient.getChatHistory(variables.sessionId, variables) as GraphQLQueryOperations[K]; throw new Error('Missing sessionId');
        case 'weaverPitchStatus': if (variables?.pitchId) return await apiClient.getWeaverPitchStatus(variables.pitchId) as GraphQLQueryOperations[K]; throw new Error('Missing pitchId');
        case 'videoGenerationStatus': if (variables?.operationId) return await apiClient.getVideoGenerationStatus(variables.operationId) as GraphQLQueryOperations[K]; throw new Error('Missing operationId');
        case 'marketplaceRecommendations': return await apiClient.getMarketplaceRecommendations(variables) as GraphQLQueryOperations[K];
        case 'marketplaceProductById': if (variables?.productId) return await apiClient.getMarketplaceProductById(variables.productId) as GraphQLQueryOperations[K]; throw new Error('Missing productId');
        case 'rewardBalance': return await apiClient.getRewardBalance() as GraphQLQueryOperations[K];
        case 'gamificationStatus': return await apiClient.getGamificationStatus() as GraphQLQueryOperations[K];
        case 'listRewardItems': return await apiClient.listRewardItems() as GraphQLQueryOperations[K];
        case 'walletInfo': return await apiClient.connectWeb3Wallet(variables as any) as GraphQLQueryOperations[K]; // This would typically be a specific wallet query endpoint, not connect
        case 'nfts': return await apiClient.listNFTs() as GraphQLQueryOperations[K];
        case 'nftDetails': if (variables?.nftId) return await apiClient.getNFTDetails(variables.nftId) as GraphQLQueryOperations[K]; throw new Error('Missing nftId');
        case 'corporateCards': return await apiClient.listCorporateCards(variables) as GraphQLQueryOperations[K];
        case 'corporateCardDetails': if (variables?.cardId) return await apiClient.getCorporateCardDetails(variables.cardId) as GraphQLQueryOperations[K]; throw new Error('Missing cardId');
        case 'corporateTransactions': return await apiClient.listCorporateTransactions(variables) as GraphQLQueryOperations[K];
        case 'paymentOrders': return await apiClient.listPaymentOrders(variables) as GraphQLQueryOperations[K];
        case 'invoices': return await apiClient.listInvoices() as GraphQLQueryOperations[K];
        case 'complianceRules': return await apiClient.listComplianceRules() as GraphQLQueryOperations[K];
        case 'complianceCases': return await apiClient.listComplianceCases(variables) as GraphQLQueryOperations[K];
        case 'financialAnomalies': return await apiClient.listAnomalies(variables) as GraphQLQueryOperations[K];
        case 'notifications': return await apiClient.listNotifications(variables) as GraphQLQueryOperations[K];
        case 'creditHealth': return await apiClient.getCreditHealth() as GraphQLQueryOperations[K];
        case 'openBankingConnections': return await apiClient.listOpenBankingConnections() as GraphQLQueryOperations[K];
        default: throw new Error(`[GraphQLClient] Unhandled query operation: ${String(operationName)}`);
      }
    } catch (error) {
      console.error("[GraphQLClient] Query failed:", error);
      throw error;
    }
  }, [apiClient]);

  const mutate = useCallback(async <K extends keyof GraphQLMutationOperations>(
    operationName: K,
    variables?: Record<string, any>
  ): Promise<GraphQLMutationOperations[K]> => {
    console.log(`[GraphQLClient] Executing mutation: ${operationName}, variables: ${JSON.stringify(variables)}`);
    try {
      switch (operationName) {
        case 'getAccessToken': if (variables) return await apiClient.getAccessToken(variables as any) as GraphQLMutationOperations[K]; throw new Error('Missing body');
        case 'revokeToken': if (variables) return await apiClient.revokeToken(variables as any) as GraphQLMutationOperations[K]; throw new Error('Missing body');
        case 'updateCurrentUser': if (variables?.userUpdate) return await apiClient.updateCurrentUser(variables.userUpdate) as GraphQLMutationOperations[K]; throw new Error('Missing userUpdate');
        case 'changePassword': if (variables) return await apiClient.changePassword(variables as any) as GraphQLMutationOperations[K]; throw new Error('Missing body');
        case 'setup2FA': return await apiClient.setup2FA() as GraphQLMutationOperations[K];
        case 'enable2FA': if (variables) return await apiClient.enable2FA(variables as any) as GraphQLMutationOperations[K]; throw new Error('Missing body');
        case 'disable2FA': return await apiClient.disable2FA() as GraphQLMutationOperations[K];
        case 'updateNotificationPreferences': if (variables) return await apiClient.updateNotificationPreferences(variables as any) as GraphQLMutationOperations[K]; throw new Error('Missing body');
        case 'unlinkAccount': if (variables?.accountId) return await apiClient.unlinkAccount(variables.accountId) as GraphQLMutationOperations[K]; throw new Error('Missing accountId');
        case 'createManualTransaction': if (variables?.transactionCreate) return await apiClient.createManualTransaction(variables.transactionCreate) as GraphQLMutationOperations[K]; throw new Error('Missing transactionCreate');
        case 'updateTransaction': if (variables?.transactionId && variables?.transactionUpdate) return await apiClient.updateTransaction(variables.transactionId, variables.transactionUpdate) as GraphQLMutationOperations[K]; throw new Error('Missing transactionId or transactionUpdate');
        case 'deleteManualTransaction': if (variables?.transactionId) return await apiClient.deleteManualTransaction(variables.transactionId) as GraphQLMutationOperations[K]; throw new Error('Missing transactionId');
        case 'detectSubscriptions': return await apiClient.detectSubscriptions() as GraphQLMutationOperations[K];
        case 'executeTrade': if (variables?.tradeRequest) return await apiClient.executeTrade(variables.tradeRequest) as GraphQLMutationOperations[K]; throw new Error('Missing tradeRequest');
        case 'projectPortfolioGrowth': if (variables?.growthSimulationRequest) return await apiClient.projectPortfolioGrowth(variables.growthSimulationRequest) as GraphQLMutationOperations[K]; throw new Error('Missing growthSimulationRequest');
        case 'createBudget': if (variables?.budgetCreate) return await apiClient.createBudget(variables.budgetCreate) as GraphQLMutationOperations[K]; throw new Error('Missing budgetCreate');
