        case 'executeCryptoPurchase': if (variables) return await apiClient.executeCryptoPurchase(variables as any) as GraphQLMutationOperations[K]; throw new Error('Missing body');
        case 'issueVirtualCard': return await apiClient.issueVirtualCard() as GraphQLMutationOperations[K];
        case 'issueCorporateCard': if (variables?.corporateCardCreate) return await apiClient.issueCorporateCard(variables.corporateCardCreate) as GraphQLMutationOperations[K]; throw new Error('Missing corporateCardCreate');
        case 'updateCorporateCardControls': if (variables?.cardId && variables?.corporateCardUpdate) return await apiClient.updateCorporateCardControls(variables.cardId, variables.corporateCardUpdate) as GraphQLMutationOperations[K]; throw new Error('Missing cardId or corporateCardUpdate');
        case 'createPaymentOrder': if (variables?.paymentOrderCreate) return await apiClient.createPaymentOrder(variables.paymentOrderCreate) as GraphQLMutationOperations[K]; throw new Error('Missing paymentOrderCreate');
        case 'reviewPaymentOrder': if (variables?.paymentOrderId && variables?.action) return await apiClient.reviewPaymentOrder(variables.paymentOrderId, { action: variables.action, reason: variables.reason }) as GraphQLMutationOperations[K]; throw new Error('Missing paymentOrderId or action');
        case 'updateAnomalyStatus': if (variables?.anomalyId && variables?.status) return await apiClient.updateAnomalyStatus(variables.anomalyId, { status: variables.status, comment: variables.comment }) as GraphQLMutationOperations[K]; throw new Error('Missing anomalyId or status');
