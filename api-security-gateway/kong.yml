_format_version: "3.0"
_comment: "Declarative configuration for Kong API Security Gateway for DemoBank."

# -----------------------------------------------------------------------------
# Upstream Services
# -----------------------------------------------------------------------------
# Defines the backend services that Kong will proxy requests to.

services:
- name: apollo-gateway-service
  # The internal URL of the Apollo Gateway service. This should match the
  # service name and port defined in the docker-compose.yml file.
  url: http://api-gateway:4000
  connect_timeout: 6000
  write_timeout: 15000
  read_timeout: 15000
  retries: 3
  tags:
  - apollo
  - graphql
  - core

# -----------------------------------------------------------------------------
# Routes
# -----------------------------------------------------------------------------
# Defines how requests from clients are mapped to upstream services.

routes:
- name: graphql-api-route
  service: apollo-gateway-service
  # This route will handle all requests to the /graphql path.
  paths:
  - /graphql
  strip_path: false
  methods:
  - GET
  - POST
  - OPTIONS
  tags:
  - public-api
  - graphql

# -----------------------------------------------------------------------------
# Global Plugins
# -----------------------------------------------------------------------------
# These plugins are applied to all services and routes unless overridden.

plugins:
- name: prometheus
  config:
    per_consumer: false
  tags:
  - observability
  - monitoring

- name: cors
  config:
    origins:
    - "${FRONTEND_URL}" # e.g., http://localhost:5173
    methods:
    - GET
    - POST
    - OPTIONS
    - PUT
    - PATCH
    - DELETE
    headers:
    - "Authorization"
    - "Content-Type"
    - "x-request-id"
    - "traceparent" # For OpenTelemetry
    - "tracestate"
    exposed_headers:
    - "Content-Length"
    - "X-Kong-Upstream-Latency"
    - "X-Kong-Proxy-Latency"
    credentials: true
    max_age: 3600
  tags:
  - security
  - browser

# -----------------------------------------------------------------------------
# Route-Specific Plugins (Applied to the GraphQL API route)
# -----------------------------------------------------------------------------

# OIDC Plugin for JWT Validation (Bearer-Only Mode)
# This plugin acts as the first line of defense, validating JWTs sent by the SPA frontend.
# It is configured for a stateless "bearer-only" mode, which is appropriate for APIs.
- name: oidc
  route: graphql-api-route
  config:
    # The discovery endpoint for the OpenID Connect provider (e.g., Keycloak, Auth0).
    # This URL is used to fetch the JWKS for token signature validation.
    discovery: "${OIDC_DISCOVERY_ENDPOINT}/.well-known/openid-configuration"
    
    # Client credentials may be needed by the plugin to communicate with the IdP for tasks
    # like token introspection, though local JWT validation is preferred.
    client_id: "${OIDC_CLIENT_ID}"
    client_secret: "${OIDC_CLIENT_SECRET}"
    introspection_endpoint_auth_method: "client_secret_post"

    # This is the key change for SPA / API authentication. It tells the plugin to expect a
    # JWT in the `Authorization: Bearer <token>` header and validate it, rather than managing a session.
    bearer_only: "yes"

    # Specify the expected algorithm for token signatures. RS256 is standard for OIDC.
    token_signing_alg_values_expected: "RS256"

    # In bearer-only mode, the plugin validates the Authorization header. Kong then passes this
    # original, validated header upstream to the Apollo Gateway, which needs it for token exchange.
    # The old session-based and custom header configurations are removed.
  tags:
  - security
  - authentication
  - oidc

# Rate Limiting Plugin for Abuse Protection
- name: rate-limiting
  route: graphql-api-route
  config:
    minute: 1000
    hour: 20000
    policy: local # Use 'redis' in a multi-node Kong cluster
    limit_by: ip
  tags:
  - security
  - traffic-control

# Bot Detection Plugin for Basic Threat Mitigation
- name: bot-detection
  route: graphql-api-route
  config:
    # A basic bot detection configuration. In a production environment, this would
    # be tuned with more sophisticated rules and potentially a custom allow/deny list.
    allow:
      # Allow common search engine crawlers if the site has public content.
      - "googlebot"
      - "bingbot"
    deny:
      # Deny known malicious user agents. This list should be updated regularly.
      - "badbot"
      - "evilbot"
      - "sqlmap"
  tags:
  - security
  - threat-detection
