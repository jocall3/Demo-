version: "3.8"

# Networks block defines the custom network for our services.
# This allows containers to communicate with each other using their service names as hostnames.
networks:
  observability-net:
    driver: bridge

# Volumes block defines named volumes for data persistence.
# This ensures that data for Prometheus, Grafana, etc., is not lost when containers are recreated.
volumes:
  prometheus_data: {}
  grafana_data: {}
  es_data: {}

services:
  # --------------------------------------------------------------------------
  # Application Services
  # --------------------------------------------------------------------------

  # The Frontend service (Vite + React)
  frontend:
    container_name: demobank-frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Expose the Vite dev server to the host machine.
      - "3000:3000"
    volumes:
      # Mount the project directory for hot-reloading during development.
      - .:/app
      # Use the node_modules from within the container, not the host machine.
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Ensures the Vite dev server is accessible outside the container.
      - HOST=0.0.0.0
      # Points the frontend to the BFF's API endpoint.
      - VITE_API_URL=http://bff:3001
      # OpenTelemetry Configuration for the Frontend
      - OTEL_SERVICE_NAME=frontend-client
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 # Using HTTP/protobuf endpoint
    depends_on:
      - bff
      - otel-collector
    networks:
      - observability-net

  # The Backend-for-Frontend service (NestJS)
  bff:
    container_name: demobank-bff
    build:
      context: ./bff
      dockerfile: Dockerfile
    ports:
      # Expose the BFF port to the host for direct API testing.
      - "3001:3001"
    volumes:
      - ./bff:/app
      - /app/node_modules
    env_file:
      - ./bff/.env
    environment:
      # OpenTelemetry Configuration for the BFF
      - OTEL_SERVICE_NAME=bff-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 # Using HTTP/protobuf endpoint
    depends_on:
      - otel-collector
    networks:
      - observability-net

  # --------------------------------------------------------------------------
  # Observability Stack
  # --------------------------------------------------------------------------

  # 1. OpenTelemetry Collector
  # Receives telemetry data (traces, metrics, logs) from services and exports it to various backends.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      # Mount the collector configuration file. This file must be created in ./observability/
      - ./observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "13133:13133" # Health check extension
    networks:
      - observability-net

  # 2. Jaeger (Distributed Tracing)
  # Stores and visualizes traces sent from the OTEL Collector.
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # Accepts traces in jaeger.thrift format over HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - observability-net
    depends_on:
      - otel-collector

  # 3. Prometheus (Metrics)
  # Scrapes and stores time-series metrics from services and the OTEL Collector.
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      # Mount the Prometheus configuration file. This file must be created in ./observability/
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090" # Prometheus UI
    networks:
      - observability-net
    depends_on:
      - otel-collector

  # 4. Grafana (Visualization)
  # Creates dashboards to visualize metrics from Prometheus and logs from Elasticsearch.
  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      # Port changed to 3002 to avoid conflict with frontend dev server
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Mount provisioning files for data sources and dashboards. This directory must be created in ./observability/
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - observability-net
    depends_on:
      - prometheus
      - elasticsearch

  # 5. Elasticsearch (Log Storage)
  # A search and analytics engine used here to store structured logs.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Disable security for local development
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Limit memory usage for development
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200" # Elasticsearch API
    networks:
      - observability-net

  # 6. Kibana (Log Visualization)
  # A web interface for searching and visualizing logs stored in Elasticsearch.
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.2
    container_name: kibana
    ports:
      - "5601:5601" # Kibana UI
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - observability-net
    depends_on:
      - elasticsearch
