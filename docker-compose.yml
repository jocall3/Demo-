version: "3.8"

# Defines the custom network that allows all services to communicate via their service names.
networks:
  app-net:
    driver: bridge

# Defines named volumes for persistent data storage for stateful services.
volumes:
  prometheus_data: {}
  grafana_data: {}
  es_data: {}
  kafka_data: {}

services:
  # --------------------------------------------------------------------------
  # Event Bus (Kafka)
  # --------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    networks:
      - app-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    networks:
      - app-net
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # --------------------------------------------------------------------------
  # API Gateway & Subgraphs (Apollo Federation)
  # --------------------------------------------------------------------------
  api-gateway:
    container_name: api-gateway
    build:
      context: ./bff
      dockerfile: Dockerfile # NOTE: Assumes a Dockerfile exists in the root 'bff' directory
    ports:
      - "4000:4000"
    volumes: # For hot-reloading in development
      - ./bff:/app
      - /app/node_modules
    environment:
      - PORT=4000
      - NODE_ENV=development
      - BANKING_SUBGRAPH_URL=http://banking-subgraph:4002/graphql
      - GENAI_SUBGRAPH_URL=http://ai-subgraph:4003/graphql
      - PLAID_SUBGRAPH_URL=http://plaid-subgraph:4005/graphql
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - banking-subgraph
      - ai-subgraph
      - plaid-subgraph
    networks:
      - app-net

  banking-subgraph:
    container_name: banking-subgraph
    build:
      context: ./services/banking
      dockerfile: Dockerfile
    ports:
      - "4002:4002"
    volumes:
      - ./services/banking:/app
      - /app/node_modules
    environment:
      - PORT=4002
      - NODE_ENV=development
      - OTEL_SERVICE_NAME=banking-subgraph
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - PROMETHEUS_PORT=9465
    depends_on:
      - otel-collector
      - kafka
    networks:
      - app-net

  ai-subgraph:
    container_name: ai-subgraph
    build:
      context: ./services/genai
      dockerfile: Dockerfile
    ports:
      - "4003:4003"
    volumes:
      - ./services/genai:/app
      - /app/node_modules
    environment:
      - PORT=4003
      - NODE_ENV=development
      - OTEL_SERVICE_NAME=ai-subgraph
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - PROMETHEUS_PORT=9465
    depends_on:
      - otel-collector
      - kafka
    networks:
      - app-net

  plaid-subgraph:
    container_name: plaid-subgraph
    build:
      context: ./services/plaid
      dockerfile: Dockerfile
    ports:
      - "4005:4005"
    volumes:
      - ./services/plaid:/app
      - /app/node_modules
    environment:
      - PORT=4005
      - NODE_ENV=development
      - OTEL_SERVICE_NAME=plaid-subgraph
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - PLAID_PROMETHEUS_PORT=9465
    depends_on:
      - otel-collector
      - kafka
    networks:
      - app-net

  # --------------------------------------------------------------------------
  # Client Application
  # --------------------------------------------------------------------------
  frontend:
    container_name: demobank-frontend
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:ui"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_GRAPHQL_GATEWAY_URL=http://localhost:4000
      - VITE_OTEL_COLLECTOR_URL=http://localhost:4318/v1/traces
    depends_on:
      - api-gateway
    networks:
      - app-net

  # --------------------------------------------------------------------------
  # Observability Stack
  # --------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml # NOTE: Assumes this config file exists
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - app-net

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: jaeger
    ports:
      - "16686:16686"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - app-net
    depends_on:
      - otel-collector

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - app-net
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - app-net
    depends_on:
      - prometheus

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - app-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.2
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - app-net
    depends_on:
      - elasticsearch
