version: "3.8"

# Defines the custom network that allows all services to communicate via their service names.
networks:
  app-net:
    driver: bridge

# Defines named volumes for persistent data storage for stateful services.
volumes:
  prometheus_data: {}
  grafana_data: {}
  es_data: {}

services:
  # --------------------------------------------------------------------------
  # API Gateway & Subgraphs (Apollo Federation)
  # --------------------------------------------------------------------------

  # The main entry point for the application. It runs Apollo Gateway to compose
  # the subgraphs into a single, unified Supergraph.
  api-gateway:
    container_name: api-gateway
    build:
      context: ./gateway # Assumes a new 'gateway' directory for the Apollo Gateway service
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes: # For hot-reloading in development
      - ./gateway:/app
      - /app/node_modules
    environment:
      - PORT=4000
      - NODE_ENV=development
      # URLs for the subgraph services, which the gateway will introspect.
      - USERS_SUBGRAPH_URL=http://users-subgraph:4001/graphql
      - BANKING_SUBGRAPH_URL=http://banking-subgraph:4002/graphql
      - AI_SUBGRAPH_URL=http://ai-subgraph:4003/graphql
      # OpenTelemetry Configuration
      - OTEL_SERVICE_NAME=api-gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - users-subgraph
      - banking-subgraph
      - ai-subgraph
    networks:
      - app-net

  # Subgraph service for user management, authentication, etc.
  users-subgraph:
    container_name: users-subgraph
    build:
      context: ./subgraphs/users # Assumes a new 'subgraphs/users' directory
      dockerfile: Dockerfile
    ports:
      - "4001:4001" # Exposing for easier debugging
    volumes: # For hot-reloading in development
      - ./subgraphs/users:/app
      - /app/node_modules
    environment:
      - PORT=4001
      - NODE_ENV=development
      - OTEL_SERVICE_NAME=users-subgraph
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - otel-collector
    networks:
      - app-net

  # Subgraph service for all banking and financial data logic (e.g., Plaid integration).
  banking-subgraph:
    container_name: banking-subgraph
    build:
      context: ./subgraphs/banking # Assumes a new 'subgraphs/banking' directory
      dockerfile: Dockerfile
    ports:
      - "4002:4002" # Exposing for easier debugging
    volumes: # For hot-reloading in development
      - ./subgraphs/banking:/app
      - /app/node_modules
    # env_file: # Uncomment to use a dedicated .env file for secrets
    #   - ./subgraphs/banking/.env
    environment:
      - PORT=4002
      - NODE_ENV=development
      - OTEL_SERVICE_NAME=banking-subgraph
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - otel-collector
    networks:
      - app-net

  # Subgraph service for handling all Generative AI features (e.g., Gemini integration).
  ai-subgraph:
    container_name: ai-subgraph
    build:
      context: ./subgraphs/ai # Assumes a new 'subgraphs/ai' directory
      dockerfile: Dockerfile
    ports:
      - "4003:4003" # Exposing for easier debugging
    volumes: # For hot-reloading in development
      - ./subgraphs/ai:/app
      - /app/node_modules
    # env_file: # Uncomment to use a dedicated .env file for secrets
    #   - ./subgraphs/ai/.env
    environment:
      - PORT=4003
      - NODE_ENV=development
      - OTEL_SERVICE_NAME=ai-subgraph
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - otel-collector
    networks:
      - app-net

  # --------------------------------------------------------------------------
  # Client Application
  # --------------------------------------------------------------------------

  frontend:
    container_name: demobank-frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # Vite dev server port as configured in vite.config.ts
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      # The frontend now communicates with the GraphQL Supergraph via the API Gateway.
      - VITE_GRAPHQL_ENDPOINT=http://api-gateway:4000/graphql
      # OpenTelemetry Configuration
      - OTEL_SERVICE_NAME=frontend-client
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - api-gateway
    networks:
      - app-net

  # --------------------------------------------------------------------------
  # Observability Stack
  # NOTE: ./prometheus/prometheus.yml must be updated to scrape the new services
  # (api-gateway, users-subgraph, banking-subgraph, ai-subgraph)
  # --------------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      # NOTE: Assumes an otel-collector-config.yml file exists in a local 'observability' directory.
      - ./observability/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "13133:13133" # Health Check
    networks:
      - app-net

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # Trace receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - app-net
    depends_on:
      - otel-collector

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090" # Prometheus UI
    networks:
      - app-net
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports:
      - "3002:3000" # Use host port 3002 to avoid conflict with frontend
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - app-net
    depends_on:
      - prometheus
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - app-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.2
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - app-net
    depends_on:
      - elasticsearch
