version: "3.9"

networks:
  demobank-net:
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}
  keycloak_db_data: {}
  vault_data: {}
  kafka_data: {}
  zookeeper_data: {}
  zookeeper_log: {}
  es_data: {}
  temporal_db_data: {}
  user_db_data: {}
  accounts_db_data: {}
  transactions_db_data: {}
  plaid_db_data: {}
  mongo_data: {}

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    networks: [demobank-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka
    networks: [demobank-net]
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    volumes: [kafka_data:/var/lib/kafka/data]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  redis:
    image: redis:7-alpine
    container_name: redis
    networks: [demobank-net]
    ports: ["6379:6379"]

  user-db:
    image: postgres:15-alpine
    container_name: user-db
    networks: [demobank-net]
    volumes: [user_db_data:/var/lib/postgresql/data]
    environment: { POSTGRES_DB: user_db, POSTGRES_USER: user, POSTGRES_PASSWORD: password }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U user -d user_db"], interval: 10s, timeout: 5s, retries: 5 }

  accounts-db:
    image: postgres:15-alpine
    container_name: accounts-db
    networks: [demobank-net]
    volumes: [accounts_db_data:/var/lib/postgresql/data]
    environment: { POSTGRES_DB: accounts_db, POSTGRES_USER: accounts, POSTGRES_PASSWORD: password }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U accounts -d accounts_db"], interval: 10s, timeout: 5s, retries: 5 }

  transactions-db:
    image: postgres:15-alpine
    container_name: transactions-db
    networks: [demobank-net]
    volumes: [transactions_db_data:/var/lib/postgresql/data]
    environment: { POSTGRES_DB: transactions_db, POSTGRES_USER: transactions, POSTGRES_PASSWORD: password }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U transactions -d transactions_db"], interval: 10s, timeout: 5s, retries: 5 }

  plaid-db:
    image: postgres:15-alpine
    container_name: plaid-db
    networks: [demobank-net]
    volumes: [plaid_db_data:/var/lib/postgresql/data]
    environment: { POSTGRES_DB: plaid_db, POSTGRES_USER: plaid, POSTGRES_PASSWORD: password }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U plaid -d plaid_db"], interval: 10s, timeout: 5s, retries: 5 }

  mongo:
    image: mongo:6.0
    container_name: mongo
    networks: [demobank-net]
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    environment: { MONGO_INITDB_ROOT_USERNAME: root, MONGO_INITDB_ROOT_PASSWORD: password }

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports: ["8200:8200"]
    networks: [demobank-net]
    volumes: ['./vault/config.hcl:/vault/config/local.hcl', './vault/policies:/vault/policies', vault_data:/vault/file]
    command: server -config=/vault/config/local.hcl
    environment: { VAULT_ADDR: http://127.0.0.1:8200, VAULT_API_ADDR: http://127.0.0.1:8200, VAULT_DEV_ROOT_TOKEN_ID: root }
    cap_add: ["IPC_LOCK"]

  keycloak-db:
    image: postgres:15-alpine
    container_name: keycloak-db
    volumes: [keycloak_db_data:/var/lib/postgresql/data]
    networks: [demobank-net]
    environment: { POSTGRES_DB: keycloak, POSTGRES_USER: keycloak, POSTGRES_PASSWORD: password }

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev --import-realm
    volumes: ['./identity/keycloak-realm.json:/opt/keycloak/data/import/realm.json']
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]
    networks: [demobank-net]
    depends_on: [keycloak-db]

  temporal-db:
    image: postgres:15-alpine
    container_name: temporal-db
    networks: [demobank-net]
    environment: { POSTGRES_USER: temporal, POSTGRES_PASSWORD: temporal, POSTGRES_DB: temporal }
    volumes: [temporal_db_data:/var/lib/postgresql/data]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: elasticsearch
    environment: ["discovery.type=single-node", "xpack.security.enabled=false", "ES_JAVA_OPTS=-Xms512m -Xmx512m"]
    ports: ["9200:9200"]
    networks: [demobank-net]
    volumes: [es_data:/usr/share/elasticsearch/data]

  temporal:
    image: temporalio/auto-setup:1.22.3
    container_name: temporal
    ports: ["7233:7233", "8088:8088"]
    networks: [demobank-net]
    environment: { DB: postgresql, DB_PORT: 5432, DB_HOST: temporal-db, DB_USER: temporal, DB_PASSWORD: temporal, POSTGRES_SEEDS: temporal-db, ES_SEEDS: elasticsearch, ES_VERSION: v8 }
    depends_on: [temporal-db, elasticsearch]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.97.0
    container_name: otel-collector
    ports: ["4318:4318", "8889:8889"]
    networks: [demobank-net]

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    volumes: ['./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml', prometheus_data:/prometheus]
    ports: ["9090:9090"]
    networks: [demobank-net]
    depends_on: [otel-collector]

  grafana:
    image: grafana/grafana:10.4.1
    container_name: grafana
    ports: ["3000:3000"]
    volumes: [grafana_data:/var/lib/grafana, './grafana/provisioning:/etc/grafana/provisioning', './grafana/dashboards:/etc/grafana/dashboards']
    environment: { GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: admin }
    networks: [demobank-net]
    depends_on: [prometheus]

  api-gateway:
    build: { context: ./api-gateway }
    container_name: api-gateway
    networks: [demobank-net]
    ports: ["4000:4000"]
    depends_on: [user-service, accounts-service, transactions-service, ai-agent-service, plaid-integration-service, vault, keycloak]
    environment: { PORT: 4000, OTEL_SERVICE_NAME: api-gateway, OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318, PROMETHEUS_PORT: 9464, USERS_SERVICE_URL: http://user-service:4001/graphql, ACCOUNTS_SERVICE_URL: http://accounts-service:4002/graphql, TRANSACTIONS_SERVICE_URL: http://transactions-service:4003/graphql, AI_AGENT_SERVICE_URL: http://ai-agent-service:4004/graphql, PLAID_INTEGRATION_SERVICE_URL: http://plaid-integration-service:4005/graphql, VAULT_ADDR: http://vault:8200, OIDC_ISSUER_URL: http://keycloak:8080/realms/demobank, OIDC_AUDIENCE: api-gateway, OIDC_CLIENT_ID: api-gateway-client }

  user-service:
    build: ./services/user-service
    container_name: user-service
    networks: [demobank-net]
    ports: ["4001:4001", "9465:9465"]
    depends_on: [user-db, kafka]

  accounts-service:
    build: ./services/accounts-service
    container_name: accounts-service
    networks: [demobank-net]
    ports: ["4002:4002", "9466:9466"]
    depends_on: [accounts-db, kafka]

  transactions-service:
    build: ./services/transactions-service
    container_name: transactions-service
    networks: [demobank-net]
    ports: ["4003:4003", "9468:9468"]
    depends_on: [transactions-db, kafka, temporal]

  ai-agent-service:
    build: ./services/ai-agent-service
    container_name: ai-agent-service
    networks: [demobank-net]
    ports: ["4004:4004", "9467:9467"]
    depends_on: [kafka, temporal]

  plaid-integration-service:
    build: ./services/plaid-integration-service
    container_name: plaid-integration-service
    networks: [demobank-net]
    ports: ["4005:4005", "9469:9469"]
    depends_on: [plaid-db, kafka]

  accounts-projection-service:
    build: ./services/accounts-projection-service
    container_name: accounts-projection-service
    networks: [demobank-net]
    depends_on: [mongo, kafka]

  transactions-projection-service:
    build: ./services/transactions-projection-service
    container_name: transactions-projection-service
    networks: [demobank-net]
    depends_on: [mongo, kafka]

  backstage:
    image: backstage/backstage
    container_name: backstage
    ports: ["7007:7007"]
    networks: [demobank-net]
    environment: { APP_CONFIG_app_baseUrl: http://localhost:7007 }
