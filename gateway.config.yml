server:
  # The public-facing port for the edge gateway
  port: 8080

pipelines:
  # This pipeline handles all incoming GraphQL traffic.
  - name: graphql-pipeline
    apiEndpoints:
      - graphql
    policies:
      # 1. OpenTelemetry for distributed tracing at the edge.
      - opentelemetry:
          action:
            serviceName: 'edge-gateway'
            sampler:
              type: 'always_on' # Trace every request in this demo
            exporter:
              type: 'otlp'
              endpoint: 'http://otel-collector:4317' # OTel Collector gRPC endpoint

      # 2. Structured logging with trace context injection.
      - log:
          action:
            format: 'json'
            message: >
              method=${req.method} url=${req.url} statusCode=${res.statusCode} 
              traceId=${context.opentelemetry.traceId} 
              spanId=${context.opentelemetry.spanId}

      # 3. CORS to allow requests from the frontend application.
      - cors:
          action:
            origin: ['http://localhost:5173', 'https://demobank.com']
            credentials: true

      # 4. Rate limiting to protect the backend services from abuse.
      - rate-limit:
          action:
            windowMs: 60000 # 1 minute window
            max: 1000 # Limit each IP to 1000 requests per window
            message: 'Too many requests, please try again later.'

      # 5. JWT validation for securing the GraphQL API.
      - jwt:
          action:
            jwksUri: 'https://demobank.us.auth0.com/.well-known/jwks.json'
            audience: 'https://api.demobank.com'
            issuer: 'https://demobank.us.auth0.com/'

      # 6. Proxy the validated, traced request to the internal Apollo Gateway.
      - proxy:
          action:
            serviceEndpoint: apollo-gateway
            changeOrigin: true
            # No pathRewrite is needed as we are forwarding /graphql to the gateway's /graphql endpoint.

  # This pipeline exposes the gateway's own internal metrics for Prometheus to scrape.
  - name: metrics-pipeline
    apiEndpoints:
      - metrics
    policies:
      - prometheus:
          action:
            collectDefaultMetrics: true
            customLabels:
              service: 'edge-gateway'

# Define the public-facing API endpoints that this gateway manages.
apiEndpoints:
  - name: graphql
    path: '/graphql' # The single endpoint for the federated GraphQL API
  - name: metrics
    path: '/metrics' # The endpoint for this gateway's metrics

# Define the downstream services that this gateway can proxy requests to.
serviceEndpoints:
  - name: apollo-gateway
    # The 'bff' service, now refactored into the Apollo Gateway, runs on port 3001.
    url: 'http://bff:3001'
