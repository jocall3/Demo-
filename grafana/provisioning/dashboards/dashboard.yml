apiVersion: 1

providers:
  # This provider loads all dashboard JSON files from the specified path.
  - name: 'service-dashboards'
    orgId: 1
    # Dashboards will appear in a folder named 'Microservices' in the Grafana UI,
    # aligning with the new microservices architecture.
    folder: 'Microservices'
    type: file
    disableDeletion: false
    editable: true
    options:
      # This path is inside the Grafana container and should be mapped
      # to the local `./grafana/dashboards` directory via a volume mount
      # in the docker-compose.yml file.
      path: /etc/grafana/dashboards
