apiVersion: 1

providers:
  - name: 'service-dashboards'
    orgId: 1
    folder: 'Services'
    type: file
    disableDeletion: false
    editable: true
    options:
      # Path to the directory where dashboard JSON files are located.
      # This path is inside the Grafana container.
      path: /etc/grafana/provisioning/dashboards
