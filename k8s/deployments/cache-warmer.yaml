apiVersion: v1
kind: Service
metadata:
  name: cache-warmer
  namespace: default
  labels:
    app: cache-warmer
    service: cache-warmer
spec:
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
  selector:
    app: cache-warmer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-warmer
  namespace: default
  labels:
    app: cache-warmer
    service: cache-warmer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-warmer
  template:
    metadata:
      labels:
        app: cache-warmer
        service: cache-warmer
      annotations:
        sidecar.istio.io/inject: "true"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "cache-warmer-role"
        vault.hashicorp.com/agent-inject-secret-redis-creds: "secret/data/redis"
        vault.hashicorp.com/agent-inject-template-redis-creds: |
          {{"{{- with secret \"secret/data/redis\" -}}"}}
          {{"{{- .Data.data.password -}}"}}
          {{"{{- end -}}"}}
    spec:
      serviceAccountName: cache-warmer-sa # Assumes a ServiceAccount with this name exists
      containers:
        - name: cache-warmer
          image: demobank/cache-warmer:latest # Replace with actual image path
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "8080"
            - name: LOG_LEVEL
              value: "info"
            - name: OTEL_SERVICE_NAME
              value: "cache-warmer"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: KAFKA_BROKERS
              value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: KAFKA_CONSUMER_GROUP_ID
              value: "cache-warmer-group"
            - name: KAFKA_EVENT_TOPICS # Comma-separated list of topics to subscribe to
              value: "account.events,transaction.events,user.events"
            - name: REDIS_HOST
              value: "redis-master.database.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD_PATH
              value: "/vault/secrets/redis-creds"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
