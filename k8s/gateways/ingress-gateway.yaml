apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: demobank-gateway
  # This Gateway resource should be deployed in the same namespace as the Istio ingress controller.
  namespace: istio-system
spec:
  selector:
    # This selector targets the default Istio ingress gateway deployment,
    # which is typically labeled with 'istio: ingressgateway'.
    istio: ingressgateway
  servers:
    # Server for HTTP traffic on port 80.
    # This configuration redirects all incoming HTTP requests to HTTPS, enforcing encryption.
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        # Define the public-facing hostnames for the application.
        # This replaces the wildcard host to be more explicit about the application's entrypoints,
        # aligning with the new multi-tiered API architecture with dedicated Experience APIs.
        - "app.demobank.example.com"                # For the main web app (MFE Shell)
        - "api.demobank.example.com"                # For the Supergraph Gateway & other general APIs
        - "dashboard.api.demobank.example.com"    # For the Dashboard Experience API
        - "onboarding.api.demobank.example.com"   # For the Onboarding Experience API
      tls:
        httpsRedirect: true # Enforces HTTPS for all traffic.

    # Server for HTTPS traffic on port 443.
    # This is the primary entry point for all application traffic into the service mesh.
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        # VirtualServices will match on these hosts to route traffic to the correct backend services
        # (e.g., MFE Shell, Experience APIs, Supergraph Gateway).
        - "app.demobank.example.com"
        - "api.demobank.example.com"
        - "dashboard.api.demobank.example.com"
        - "onboarding.api.demobank.example.com"
      tls:
        # 'SIMPLE' mode terminates the TLS connection from the client (browser) at the gateway.
        # Traffic from this gateway to the backend services will then be secured by the
        # service mesh's automatic mutual TLS (mTLS), fulfilling the zero-trust directive.
        mode: SIMPLE
        # The name of the Kubernetes secret that contains the TLS certificate and private key for your domain(s).
        # This secret must exist in the 'istio-system' namespace and should cover all specified hosts.
        # In a production setup, this would be managed by a tool like cert-manager.
        credentialName: demobank-tls-credential
