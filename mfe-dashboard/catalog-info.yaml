apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mfe-dashboard
  description: The Dashboard Micro-Frontend, responsible for the main user landing page. It consumes the Experience Dashboard API to orchestrate and display a personalized financial overview.
  tags:
    - microfrontend
    - react
    - dashboard
    - frontend
  annotations:
    # Link to the source code repository for browsing in Backstage.
    github.com/project-slug: your-org/demobank
    # TechDocs are co-located with the code in the 'docs' directory.
    backstage.io/techdocs-ref: dir:./docs
spec:
  type: website
  lifecycle: production
  owner: team-dashboard
  system: user-experience-platform
  dependsOn:
    - component:mfe-shell
    - component:experience-dashboard-api
    - component:ui-library
  consumesApis:
    - api:experience-dashboard-api-graphql
  providesApis:
    - api:dashboard-mfe
  links:
    - url: http://localhost:5173/dashboard
      title: Live (in Shell)
      icon: dashboard
    - url: http://localhost:8081
      title: Standalone Dev
      icon: bug_report
