apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: mfe-investments
  description: A remote micro-frontend that provides a detailed view of a user's investment portfolio, market data, and ESG investing options. It is consumed by the MFE Shell.
  tags:
    - microfrontend
    - react
    - investments
    - module-federation
  annotations:
    github.com/project-slug: 'demobank/demobank-platform' # The monorepo where this component lives
    backstage.io/techdocs-ref: dir:. # Docs-as-code: TechDocs are co-located with the source code
spec:
  type: website
  lifecycle: production
  owner: team-investments # The team responsible for this MFE
  system: user-facing-applications # The larger system this component is part of
  partOf: # This component is a part of the MFE Shell
    - component:mfe-shell
  consumesApis:
    - api:supergraph-graphql # It fetches data from the federated GraphQL supergraph
  providesApis:
    - api:investments-mfe-entrypoint # It exposes itself via Module Federation for consumption by the shell
