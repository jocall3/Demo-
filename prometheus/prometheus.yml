global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # The Alertmanager service, running on its default port inside the Docker network.
            - alertmanager:9093

# Load alerting rules from a file. In a real setup, this file would contain
# rules for high error rates, service availability, high latency, etc.
rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  # Scrape Prometheus itself for metrics about its own health.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape the Alertmanager for its metrics.
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # Scrape the OpenTelemetry Collector for its internal metrics and any exported metrics.
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888'] # Default Prometheus exporter port for OTel Collector

  # --- Application Microservices ---
  # These jobs scrape the /metrics endpoint exposed by each microservice's OpenTelemetry SDK.
  # The service names (e.g., 'api-gateway') are assumed to correspond to the hostnames
  # in the container network (e.g., defined in docker-compose.yml).

  - job_name: 'api-gateway'
    metrics_path: /metrics
    static_configs:
      # The API Gateway (formerly BFF) is the main entry point.
      - targets: ['api-gateway:9464']

  - job_name: 'user-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['user-service:9465']

  - job_name: 'accounts-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['accounts-service:9465']

  - job_name: 'transactions-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['transactions-service:9465']

  - job_name: 'plaid-integration-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['plaid-integration-service:9465']

  - job_name: 'ai-agent-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['ai-agent-service:9465']

  # As new services (e.g., identity-service, security-gateway) are added,
  # their scrape configurations would be added here.