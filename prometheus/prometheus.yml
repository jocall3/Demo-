global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'gateway'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:4000']

  - job_name: 'subgraph-banking'
    metrics_path: /metrics
    static_configs:
      - targets: ['subgraph-banking:9464']

  - job_name: 'subgraph-investments'
    metrics_path: /metrics
    static_configs:
      - targets: ['subgraph-investments:9464']

  - job_name: 'subgraph-users'
    metrics_path: /metrics
    static_configs:
      - targets: ['subgraph-users:9464']

  - job_name: 'subgraph-ai'
    metrics_path: /metrics
    static_configs:
      - targets: ['subgraph-ai:9464']
