syntax = "proto3";

package account;

import "google/protobuf/empty.proto";

// Options for code generation in various languages.
option go_package = "github.com/demobank/accounts-service/proto/account";
option java_multiple_files = true;
option java_package = "com.demobank.accountservice.account";
option csharp_namespace = "DemoBank.AccountService.Account";

// AccountCommandService defines the gRPC interface for the command-side of the Account bounded context.
// It adheres to CQRS by only exposing methods that change the state of an Account aggregate.
// All operations are idempotent and result in the emission of domain events.
service AccountCommandService {
  // Creates a new account aggregate.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);

  // Debits a specified amount from an account. This is an idempotent operation.
  rpc DebitAccount(DebitAccountRequest) returns (google.protobuf.Empty);

  // Credits a specified amount to an account. This is an idempotent operation.
  rpc CreditAccount(CreditAccountRequest) returns (google.protobuf.Empty);

  // Closes an account. The account must have a zero balance.
  rpc CloseAccount(CloseAccountRequest) returns (google.protobuf.Empty);
}

// --- Command Messages ---

// Request to create a new account.
message CreateAccountRequest {
  // The ID of the user who owns this account.
  string user_id = 1;

  // A user-friendly name for the new account (e.g., "Main Checking").
  string name = 2;

  // The high-level type of the account (e.g., "depository", "credit").
  string type = 3;

  // The specific subtype of the account (e.g., "checking", "savings").
  optional string subtype = 4;

  // The initial balance for the account. Defaults to 0 if not provided.
  double initial_balance = 5;

  // The ISO-4217 currency code.
  string currency_code = 6;
}

// Response after a successful account creation.
message CreateAccountResponse {
  // The unique identifier of the newly created account aggregate.
  string account_id = 1;
}

// Request to debit funds from an account.
message DebitAccountRequest {
  // The unique identifier of the account to debit.
  string account_id = 1;

  // The amount to debit. Must be a positive value.
  double amount = 2;

  // A unique identifier for the transaction to ensure idempotency.
  string transaction_id = 3;
}

// Request to credit funds to an account.
message CreditAccountRequest {
  // The unique identifier of the account to credit.
  string account_id = 1;

  // The amount to credit. Must be a positive value.
  double amount = 2;

  // A unique identifier for the transaction to ensure idempotency.
  string transaction_id = 3;
}

// Request to close an account.
message CloseAccountRequest {
  // The unique identifier of the account to close.
  string account_id = 1;
}
