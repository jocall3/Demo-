syntax = "proto3";

package plaid;

// Best practice options for code generation in other languages.
option go_package = "github.com/demobank/plaid-integration-service/plaid";
option java_multiple_files = true;
option java_package = "com.demobank.plaidintegrationservice.plaid";
option csharp_namespace = "DemoBank.PlaidIntegrationService.Plaid";

// =============================================================================
// Service Definition
// =============================================================================

// The PlaidIntegrationService provides a gRPC interface to interact with the Plaid API.
// It encapsulates all direct communication with Plaid, exposing a simplified,
// domain-specific API for other microservices.
service PlaidIntegrationService {
  // Creates a Plaid Link token for a given user to initialize the frontend Link flow.
  rpc CreateLinkToken(CreateLinkTokenRequest) returns (CreateLinkTokenResponse);

  // Exchanges a temporary public token from Plaid Link for a permanent access token and item ID.
  // The service is responsible for securely storing the access token and associated metadata.
  rpc ExchangePublicToken(ExchangePublicTokenRequest) returns (ExchangePublicTokenResponse);

  // Fetches a list of financial accounts for a given user that are linked via Plaid.
  rpc GetAccounts(GetAccountsRequest) returns (GetAccountsResponse);

  // Fetches a single financial account by its unique ID.
  rpc GetAccountById(GetAccountByIdRequest) returns (Account);

  // Fetches a list of transactions for a given user over a specified date range.
  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsResponse);

  // Fetches a single transaction by its unique ID.
  rpc GetTransactionById(GetTransactionByIdRequest) returns (Transaction);

  // Fetches information about a Plaid Item (a user's connection to an institution).
  rpc GetItem(GetItemRequest) returns (GetItemResponse);

  // Removes a Plaid Item, effectively unlinking all accounts connected via that item for the user.
  rpc RemoveItem(RemoveItemRequest) returns (RemoveItemResponse);
}

// =============================================================================
// Core Data Structures
// These messages represent the entities managed by the Plaid Integration Service.
// =============================================================================

// Represents the balance of a financial account.
message Balance {
  // The amount of funds available for use. Can be null if not available.
  optional double available = 1;
  // The total amount of funds in the account.
  double current = 2;
  // The ISO-4217 currency code of the balance (e.g., "USD").
  string iso_currency_code = 3;
}

// Represents geographical information for a transaction.
message Location {
  // The full street address.
  optional string address = 1;
  // The city.
  optional string city = 2;
  // The region or state.
  optional string region = 3;
  // The postal code.
  optional string postal_code = 4;
  // The ISO 3166-1 alpha-2 country code.
  optional string country = 5;
  // The latitude of the transaction.
  optional double lat = 6;
  // The longitude of the transaction.
  optional double lon = 7;
}

// Represents a single financial account linked to a user via Plaid.
message Account {
  // Plaid's unique ID for the account.
  string account_id = 1;
  // The balance of the account.
  Balance balances = 2;
  // The last 2-4 alphanumeric characters of an account number.
  string mask = 3;
  // The name of the account, either assigned by the user or by the financial institution.
  string name = 4;
  // The official name of the account as provided by the financial institution.
  optional string official_name = 5;
  // The specific subtype of the account (e.g., "checking", "credit card").
  string subtype = 6;
  // The high-level type of the account (e.g., "depository", "credit").
  string type = 7;
  // The verification status of an Auth account. Can be: "pending_automatic_verification",
  // "pending_manual_verification", "manually_verified", "verified",
  // "verification_expired", "verification_failed".
  optional string verification_status = 8;
}

// Represents a single financial transaction associated with an account.
message Transaction {
  // Plaid's unique ID for the transaction.
  string transaction_id = 1;
  // The ID of the account in which this transaction occurred.
  string account_id = 2;
  // The settled amount of the transaction. Positive for credits, negative for debits.
  double amount = 3;
  // The ISO-4217 currency code of the transaction.
  string iso_currency_code = 4;
  // A hierarchical list of categories reflecting the transaction (e.g., ["Food and Drink", "Coffee Shops"]).
  repeated string category = 5;
  // The date the transaction posted, in ISO 8601 format (YYYY-MM-DD).
  string date = 6;
  // The merchant name or transaction description.
  string name = 7;
  // The merchant name, if available.
  optional string merchant_name = 8;
  // When true, identifies the transaction as pending or unsettled.
  bool pending = 9;
  // Geographic information associated with the transaction's merchant or location.
  optional Location location = 10;
}

// Represents a Plaid Item, which is a user's connection to a financial institution.
message Item {
  // The Plaid Item ID.
  string item_id = 1;
  // The Plaid Institution ID associated with this item.
  string institution_id = 2;
  // A list of products (e.g., "transactions", "auth") that are enabled for the Item.
  repeated string available_products = 3;
  // A list of products that have been billed for the Item.
  repeated string billed_products = 4;
}

// =============================================================================
// RPC Request/Response Messages
// =============================================================================

// Request to create a Plaid Link token.
message CreateLinkTokenRequest {
  // The ID of the user for whom the link token is being created.
  string user_id = 1;
}

// Response containing the created Plaid Link token.
message CreateLinkTokenResponse {
  // The generated link token string.
  string link_token = 1;
  // The expiration date/time of the link token in ISO 8601 format.
  string expiration = 2;
  // The Plaid request ID for debugging.
  string request_id = 3;
}

// Request to exchange a Plaid public token for an access token.
message ExchangePublicTokenRequest {
  // The ID of the user who initiated the Plaid Link flow.
  string user_id = 1;
  // The public token received from the client-side Plaid Link `onSuccess` callback.
  string public_token = 2;
  // Additional metadata from the client-side Plaid Link success callback.
  // This typically includes institution details, masked account information, etc.
  map<string, string> metadata = 3;
}

// Response after exchanging a public token.
message ExchangePublicTokenResponse {
  // The Plaid Item ID of the newly connected institution.
  string item_id = 1;
  // The Plaid request ID for debugging.
  string request_id = 2;
  // Indicates whether the public token exchange was successful.
  bool success = 3;
}

// Request to get accounts for a user.
message GetAccountsRequest {
  // The ID of the user whose accounts are to be retrieved.
  string user_id = 1;
}

// Response containing a list of accounts.
message GetAccountsResponse {
  repeated Account accounts = 1;
}

// Request to get a specific account by ID.
message GetAccountByIdRequest {
  // The unique ID of the account to retrieve.
  string account_id = 1;
}

// Request to get transactions for a user.
message GetTransactionsRequest {
  // The ID of the user whose transactions are being requested.
  string user_id = 1;
  // Start date for transactions in YYYY-MM-DD format.
  string start_date = 2;
  // End date for transactions in YYYY-MM-DD format.
  string end_date = 3;
  // Optional: Filter transactions by a specific account ID.
  optional string account_id = 4;
}

// Response containing a list of transactions.
message GetTransactionsResponse {
  repeated Transaction transactions = 1;
}

// Request to get a specific transaction by ID.
message GetTransactionByIdRequest {
  // The unique ID of the transaction to retrieve.
  string transaction_id = 1;
}

// Request to get an Item for a user.
message GetItemRequest {
  // The ID of the user whose Item is to be retrieved.
  string user_id = 1;
}

// Response containing Item details.
message GetItemResponse {
  Item item = 1;
}

// Request to remove an Item for a user.
message RemoveItemRequest {
  // The ID of the user whose Item is to be removed.
  string user_id = 1;
}

// Response after removing an Item.
message RemoveItemResponse {
  // Indicates whether the item removal was successful.
  bool success = 1;
  // The Plaid request ID for debugging.
  string request_id = 2;
}
