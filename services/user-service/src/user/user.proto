syntax = "proto3";

package user;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

option go_package = "github.com/elite-ai-implementation-team/demobank/gen/go/user;user";

// UserService defines the gRPC interface for managing user accounts and identity.
// It serves as the single source of truth for user data within the microservices architecture.
service UserService {
  // Creates a new user account.
  rpc CreateUser(CreateUserRequest) returns (User) {}

  // Retrieves a user by their unique ID.
  rpc GetUserById(GetUserByIdRequest) returns (User) {}

  // Retrieves a user by their email address.
  rpc GetUserByEmail(GetUserByEmailRequest) returns (User) {}

  // Updates a user's information. Uses a field mask for partial updates.
  rpc UpdateUser(UpdateUserRequest) returns (User) {}

  // Deletes a user account (can be a soft or hard delete).
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {}

  // Validates user credentials and returns user details upon success.
  rpc AuthenticateUser(AuthenticateUserRequest) returns (User) {}
}

// The core User message representing a user entity.
// The password hash is intentionally omitted for security.
message User {
  string id = 1; // UUID
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// Request message for creating a new user.
message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string password = 4;
}

// Request message for retrieving a user by ID.
message GetUserByIdRequest {
  string id = 1;
}

// Request message for retrieving a user by email.
message GetUserByEmailRequest {
  string email = 1;
}

// Request message for updating a user.
message UpdateUserRequest {
  // The user object containing the new field values.
  // The 'id' field within the user object is used to identify the user to be updated.
  User user = 1;
  // A field mask to specify which fields of the user object should be updated.
  google.protobuf.FieldMask update_mask = 2;
}

// Request message for deleting a user.
message DeleteUserRequest {
  string id = 1;
}

// Request message for authenticating a user.
message AuthenticateUserRequest {
  string email = 1;
  string password = 2;
}
