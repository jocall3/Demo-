syntax = "proto3";

package user;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";

// As per "Adopt a Centralized Domain Modeling Language (DML)", this Protobuf file
// serves as a schema for gRPC communication, defining the contract for the user-service.
// It is aligned with the new architecture where authentication is externalized, and this
// service is the source of truth for user profile data.

option go_package = "github.com/elite-ai-implementation-team/demobank/gen/go/user;user";

// UserService defines the gRPC interface for managing user profiles.
// It serves as the single source of truth for user data within the microservices architecture.
service UserService {
  // Creates a new user profile. This is typically invoked in response to a signup event
  // from an external Identity Provider (e.g., Keycloak).
  rpc CreateUser(CreateUserRequest) returns (User);

  // Retrieves a user by their unique internal ID (UUID).
  rpc GetUserById(GetUserByIdRequest) returns (User);

  // Retrieves a user by their unique external authentication provider ID (e.g., the 'sub' claim from a JWT).
  rpc GetUserByAuthId(GetUserByAuthIdRequest) returns (User);

  // Retrieves a user by their email address.
  rpc GetUserByEmail(GetUserByEmailRequest) returns (User);

  // Updates a user's profile information. A field mask must be provided to specify which fields to update,
  // allowing for partial updates (patches).
  rpc UpdateUser(UpdateUserRequest) returns (User);

  // Deletes a user's profile. The implementation can be a soft or hard delete.
  rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty);
}

// The core User message representing a user's profile entity.
// Sensitive information like password hashes is not part of this model, as authentication
// is handled by an external Identity Provider.
message User {
  // The unique internal identifier for the user profile (UUID).
  string id = 1;

  // The unique identifier from the external authentication provider (e.g., Keycloak's 'sub' claim).
  // This field links the user's profile to their authentication identity.
  string auth_id = 2;

  // The user's full name.
  string name = 3;

  // The user's primary email address.
  string email = 4;

  // An optional title for the user, e.g., "Founder".
  optional string title = 5;

  // An optional URL for the user's avatar image.
  optional string avatar_url = 6;

  // The timestamp when the user profile was created.
  google.protobuf.Timestamp created_at = 7;

  // The timestamp when the user profile was last updated.
  google.protobuf.Timestamp updated_at = 8;
}

// Request message for creating a new user profile.
message CreateUserRequest {
  // The unique identifier from the external authentication provider.
  string auth_id = 1;

  // The user's full name.
  string name = 2;

  // The user's primary email address. Should match the record in the Identity Provider.
  string email = 3;

  // An optional URL for the user's avatar image, often provided by the IdP during signup.
  optional string avatar_url = 4;
}

// Request message for retrieving a user by their internal ID.
message GetUserByIdRequest {
  string id = 1;
}

// Request message for retrieving a user by their external authentication provider ID.
message GetUserByAuthIdRequest {
  string auth_id = 1;
}

// Request message for retrieving a user by their email address.
message GetUserByEmailRequest {
  string email = 1;
}

// Request message for updating a user's profile.
message UpdateUserRequest {
  // The user object containing the new field values.
  // The 'id' field within the user object is used to identify the user to be updated.
  User user = 1;

  // A field mask to specify which fields of the user object should be updated.
  // This allows for partial updates (PATCH semantics). For example, to update only the name,
  // the mask would contain the path "name".
  google.protobuf.FieldMask update_mask = 2;
}

// Request message for deleting a user.
message DeleteUserRequest {
  string id = 1;
}
